<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj kalendář — Rezervace — Koupelny Syrový</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="rezervace.css">
    <style>.page-wrap { max-width: 1200px; }</style>
</head>
<body>
<div class="topbar">
    <img src="../logo.png" alt="Koupelny Syrový" class="topbar__logo">
    <span class="topbar__title">Rezervace</span>
    <div class="topbar__user">
        <span class="topbar__user-name" id="userName">…</span>
        <button class="btn-logout" id="logoutBtn">Odhlásit</button>
    </div>
</div>

<div class="page-wrap">
    <nav class="subnav">
        <a href="kalendar.html" class="active" data-keep>Můj kalendář</a>
        <a href="prehled.html" data-keep>Přehled rezervací</a>
        <a href="nastaveni.html" data-keep id="navSettings" class="hidden">Nastavení</a>
    </nav>

    <p class="hint" style="margin-bottom:12px">V appce si vypisuješ, kdy můžeš. Schůzky plánuješ, kde jsi zvyklý — šedě je obsazenost z Raynetu.</p>

    <div class="toolbar">
        <button class="btn btn--ghost btn--sm" id="prevWeek">←</button>
        <button class="btn btn--ghost btn--sm" id="thisWeek">Tento týden</button>
        <button class="btn btn--ghost btn--sm" id="nextWeek">→</button>
        <strong id="weekLabel" style="margin-left:6px"></strong>
        <span class="spacer"></span>
        <select id="designerSelect" class="hidden" aria-label="Designér"></select>
        <button class="btn btn--ghost btn--sm" id="copyWeek">Zkopírovat týden na další</button>
    </div>
    <div id="banner"></div>
    <div class="week" id="week"><div class="loader"><div class="spinner"></div>Načítám…</div></div>
</div>

<div class="modal-backdrop" id="modal">
    <div class="modal">
        <button class="modal__close" id="modalClose" aria-label="Zavřít">×</button>
        <div id="modalBody"></div>
    </div>
</div>

<script type="module">
import { requireAuth, signOutUser, initFirebase, CDN, showToast } from '../shared/auth-common.js';
import {
    DEMO, STUDIO_LABELS, TYPE_LABELS, STATUS_LABELS, escapeHtml, toDate, fmtTime, fmtDay,
    pragueToDate, dateKey, timeKey, mondayKey, addDaysKey,
    DEMO_USERS, demoAvailability, demoBookings, demoBusy,
} from './rezervace-common.js';

const { collection, query, where, getDocs, getDoc, doc, addDoc, updateDoc, deleteDoc, writeBatch, Timestamp } =
    await import(`${CDN}/firebase-firestore.js`);

let db = null;
let me = null;          // slug přihlášeného
let isAdmin = false;
let users = {};
let config = { studios: {} };
let designerSlug = null;
let weekKey = mondayKey(new Date());
let blocks = [], bookings = [], busy = [];

const $ = (id) => document.getElementById(id);

async function init() {
    if (DEMO) {
        me = 'demo'; isAdmin = true; users = DEMO_USERS;
        $('userName').textContent = 'Demo mód';
    } else {
        const session = await requireAuth('/login.html');
        if (!session) return;
        me = session.slug;
        isAdmin = ['hr', 'admin'].includes(session.profile?.platformRole);
        $('userName').textContent = session.profile?.name ?? session.user.email;
        $('logoutBtn').addEventListener('click', () => signOutUser('/login.html'));
        ({ db } = await initFirebase());
        const [usersSnap, cfgSnap] = await Promise.all([getDocs(collection(db, 'users')), getDoc(doc(db, 'config', 'rezervace'))]);
        users = Object.fromEntries(usersSnap.docs.map(d => [d.id, d.data()]));
        if (cfgSnap.exists()) config = cfgSnap.data();
    }
    if (DEMO) document.querySelectorAll('[data-keep]').forEach(a => a.href += '?demo=1');
    if (isAdmin) $('navSettings').classList.remove('hidden');

    const params = new URLSearchParams(location.search);
    designerSlug = (isAdmin && params.get('designer')) || me;
    if (isAdmin) {
        const sel = $('designerSelect');
        const list = Object.entries(users).filter(([, u]) => u.reservations?.enabled || u.department === 'sales')
            .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'cs'));
        if (!list.some(([s]) => s === me)) list.unshift([me, users[me] || { name: me }]);
        sel.innerHTML = list.map(([s, u]) => `<option value="${s}">${escapeHtml(u.name || s)}${u.reservations?.enabled ? '' : ' (nepovolen)'}</option>`).join('');
        sel.value = designerSlug;
        sel.classList.remove('hidden');
        sel.addEventListener('change', () => { designerSlug = sel.value; load(); });
    }

    $('prevWeek').addEventListener('click', () => { weekKey = addDaysKey(weekKey, -7); load(); });
    $('nextWeek').addEventListener('click', () => { weekKey = addDaysKey(weekKey, 7); load(); });
    $('thisWeek').addEventListener('click', () => { weekKey = mondayKey(new Date()); load(); });
    $('copyWeek').addEventListener('click', copyWeek);
    $('modalClose').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    await load();
}

const weekStart = () => pragueToDate(weekKey);
const weekEnd = () => pragueToDate(addDaysKey(weekKey, 7));

async function load() {
    const from = weekStart(), to = weekEnd();
    if (DEMO) {
        blocks = demoAvailability().filter(b => b.designerSlug === designerSlug && b.start >= from && b.start < to);
        bookings = demoBookings().filter(b => b.designerSlug === designerSlug && b.start >= from && b.start < to);
        busy = (demoBusy()[designerSlug] || []).filter(b => b.start >= from && b.start < to);
    } else {
        const range = (col) => query(collection(db, col), where('start', '>=', Timestamp.fromDate(from)), where('start', '<', Timestamp.fromDate(to)));
        const [aSnap, bSnap, busySnap] = await Promise.all([getDocs(range('res_availability')), getDocs(range('res_bookings')), getDoc(doc(db, 'res_busy', designerSlug))]);
        blocks = aSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.designerSlug === designerSlug);
        bookings = bSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.designerSlug === designerSlug && b.status !== 'cancelled');
        busy = (busySnap.exists() ? busySnap.data().intervals || [] : []).filter(i => toDate(i.start) < to && toDate(i.end) > from);
    }
    render();
}

function render() {
    const end = addDaysKey(weekKey, 6);
    $('weekLabel').textContent = `${fmtDay(pragueToDate(weekKey))} – ${fmtDay(pragueToDate(end))}`;
    const u = users[designerSlug] || {};
    const r = u.reservations || {};
    const banner = [];
    if (!r.enabled) banner.push(`<div class="banner banner--warn">${escapeHtml(u.name || designerSlug)} zatím nemá povolené rezervace — bloky se klientům nenabídnou, dokud to admin nezapne v Nastavení.</div>`);
    else if (!r.raynetUserId) banner.push('<div class="banner banner--info">Chybí Raynet ID — rezervace se do tvého kalendáře v Raynetu nepropíšou a obsazenost z Raynetu se nenačte.</div>');
    $('banner').innerHTML = banner.join('');

    const today = dateKey(new Date());
    const items = [
        ...blocks.map(b => ({ kind: 'block', start: toDate(b.start), end: toDate(b.end), data: b })),
        ...bookings.map(b => ({ kind: 'booking', start: toDate(b.start), end: toDate(b.end), data: b })),
        ...busy.map(b => ({ kind: 'busy', start: toDate(b.start), end: toDate(b.end), data: b })),
    ];
    let html = '';
    for (let i = 0; i < 7; i++) {
        const key = addDaysKey(weekKey, i);
        const dayItems = items.filter(it => dateKey(it.start) === key).sort((a, b) => a.start - b.start);
        html += `<div class="day ${key === today ? 'day--today' : ''}">
            <div class="day__head"><span>${escapeHtml(fmtDay(pragueToDate(key)))}</span>
            <button class="day__add" data-add="${key}" title="Přidat blok dostupnosti">+</button></div>
            ${dayItems.map(itemHtml).join('') || '<span class="hint">—</span>'}
        </div>`;
    }
    $('week').innerHTML = html;
    $('week').querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => openBlock(null, b.dataset.add)));
    $('week').querySelectorAll('[data-block]').forEach(b => b.addEventListener('click', () => openBlock(blocks.find(x => x.id === b.dataset.block))));
}

function itemHtml(it) {
    const time = `${fmtTime(it.start)}–${fmtTime(it.end)}`;
    if (it.kind === 'block') {
        const b = it.data;
        const label = b.serviceType === 'studio' ? `Studio ${STUDIO_LABELS[b.studio] || b.studio}` : 'Návrh doma';
        return `<div class="item item--${b.serviceType}" data-block="${b.id}">${time}<small>${escapeHtml(label)}</small></div>`;
    }
    if (it.kind === 'booking') {
        const b = it.data;
        return `<div class="item item--booking ${b.status}">${time} ${escapeHtml(b.client?.name || '')}
            <small>${escapeHtml(b.serviceName || '')} · ${escapeHtml(STATUS_LABELS[b.status] || b.status)}</small></div>`;
    }
    return `<div class="item item--busy">${time}<small>Obsazeno (Raynet)</small></div>`;
}

// ── přidání / úprava bloku ──

function openingWarning(serviceType, studio, dayKey, from, to) {
    if (serviceType !== 'studio') return '';
    const hours = config.studios?.[studio]?.openingHours || {};
    const dow = String((new Date(`${dayKey}T12:00:00Z`).getUTCDay() + 6) % 7 + 1); // 1 = pondělí
    const h = hours[dow];
    if (!Object.keys(hours).length) return '';
    if (!h) return `Studio ${STUDIO_LABELS[studio]} má v tento den zavřeno.`;
    if (from < h[0] || to > h[1]) return `Blok je mimo otevírací dobu studia (${h[0]}–${h[1]}).`;
    return '';
}

function openBlock(block, dayKeyArg) {
    const r = users[designerSlug]?.reservations || {};
    const studios = (r.studios?.length ? r.studios : Object.keys(STUDIO_LABELS));
    const day = block ? dateKey(toDate(block.start)) : dayKeyArg;
    const type = block?.serviceType || 'studio';
    $('modalBody').innerHTML = `
        <h2>${block ? 'Upravit blok' : 'Nový blok dostupnosti'}</h2>
        <p class="hint">${escapeHtml(users[designerSlug]?.name || designerSlug)} · ${escapeHtml(fmtDay(pragueToDate(day)))}</p>
        <div class="form-group" style="margin-top:14px"><label>Služba</label>
            <select id="fType">${Object.entries(TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="form-group" id="fStudioWrap"><label>Studio</label>
            <select id="fStudio">${studios.map(s => `<option value="${s}" ${s === block?.studio ? 'selected' : ''}>${STUDIO_LABELS[s]}</option>`).join('')}</select></div>
        <div class="row2">
            <div class="form-group"><label>Od</label><input type="time" id="fFrom" step="1800" value="${block ? timeKey(toDate(block.start)) : '09:00'}"></div>
            <div class="form-group"><label>Do</label><input type="time" id="fTo" step="1800" value="${block ? timeKey(toDate(block.end)) : '13:00'}"></div>
        </div>
        <p class="hint hint--warn" id="fWarn"></p>
        <p class="form-error" id="fErr"></p>
        <div class="btn-row">
            <button class="btn btn--primary" id="fSave">Uložit</button>
            ${block ? '<button class="btn btn--danger" id="fDelete">Smazat blok</button>' : ''}
        </div>`;
    const refresh = () => {
        const t = $('fType').value;
        $('fStudioWrap').classList.toggle('hidden', t !== 'studio');
        $('fWarn').textContent = openingWarning(t, $('fStudio').value, day, $('fFrom').value, $('fTo').value);
    };
    ['fType', 'fStudio', 'fFrom', 'fTo'].forEach(id => $(id).addEventListener('change', refresh));
    refresh();
    $('fSave').addEventListener('click', () => saveBlock(block, day));
    if (block) $('fDelete').addEventListener('click', () => deleteBlock(block));
    $('modal').classList.add('open');
}

async function saveBlock(block, day) {
    const serviceType = $('fType').value;
    const from = $('fFrom').value, to = $('fTo').value;
    if (!from || !to || from >= to) { $('fErr').textContent = 'Konec musí být po začátku.'; return; }
    const data = {
        designerSlug, serviceType,
        studio: serviceType === 'studio' ? $('fStudio').value : null,
        start: pragueToDate(day, from), end: pragueToDate(day, to),
    };
    const overlap = blocks.some(b => b.id !== block?.id && b.serviceType === serviceType && toDate(b.start) < data.end && toDate(b.end) > data.start);
    if (overlap) { $('fErr').textContent = 'Překrývá se s jiným blokem stejné služby.'; return; }
    if (DEMO) { showToast('Demo: blok by se uložil'); closeModal(); return; }
    try {
        const payload = { ...data, start: Timestamp.fromDate(data.start), end: Timestamp.fromDate(data.end) };
        if (block) await updateDoc(doc(db, 'res_availability', block.id), payload);
        else await addDoc(collection(db, 'res_availability'), { ...payload, createdBy: me, createdAt: Timestamp.now() });
        showToast('Uloženo', 'success');
        closeModal();
        load();
    } catch (err) {
        console.error(err);
        $('fErr').textContent = 'Uložit se nepodařilo (oprávnění?).';
    }
}

async function deleteBlock(block) {
    if (!confirm('Smazat tento blok? Už domluvené rezervace zůstávají.')) return;
    if (DEMO) { showToast('Demo: blok by se smazal'); closeModal(); return; }
    await deleteDoc(doc(db, 'res_availability', block.id));
    closeModal();
    load();
}

// "Zkopírovat týden" místo opakovacích pravidel (spec kap. 4): bloky tohoto
// týdne → stejné dny a časy příští týden, existující stejné bloky se přeskočí.
async function copyWeek() {
    if (!blocks.length) { showToast('Tento týden nemá žádné bloky.'); return; }
    const nextKey = addDaysKey(weekKey, 7);
    if (!confirm(`Zkopírovat ${blocks.length} bloků na týden od ${fmtDay(pragueToDate(nextKey))}?`)) return;
    if (DEMO) { showToast('Demo: bloky by se zkopírovaly'); return; }
    const from = pragueToDate(nextKey), to = pragueToDate(addDaysKey(nextKey, 7));
    const existing = (await getDocs(query(collection(db, 'res_availability'), where('start', '>=', Timestamp.fromDate(from)), where('start', '<', Timestamp.fromDate(to)))))
        .docs.map(d => d.data()).filter(b => b.designerSlug === designerSlug);
    const batch = writeBatch(db);
    let n = 0;
    for (const b of blocks) {
        // Přes pražský čas, ať blok sedí i přes přechod letního/zimního času.
        const day = addDaysKey(dateKey(toDate(b.start)), 7);
        const start = pragueToDate(day, timeKey(toDate(b.start)));
        const end = pragueToDate(day, timeKey(toDate(b.end)));
        if (existing.some(e => e.serviceType === b.serviceType && toDate(e.start) < end && toDate(e.end) > start)) continue;
        batch.set(doc(collection(db, 'res_availability')), {
            designerSlug, serviceType: b.serviceType, studio: b.studio || null,
            start: Timestamp.fromDate(start), end: Timestamp.fromDate(end), createdBy: me, createdAt: Timestamp.now(),
        });
        n++;
    }
    await batch.commit();
    showToast(n ? `Zkopírováno ${n} bloků` : 'Příští týden už bloky má', 'success');
    weekKey = nextKey;
    load();
}

function closeModal() { $('modal').classList.remove('open'); }

init().catch(err => {
    console.error(err);
    $('week').innerHTML = '<div class="empty-state">Kalendář se nepodařilo načíst.</div>';
});
</script>
</body>
</html>
