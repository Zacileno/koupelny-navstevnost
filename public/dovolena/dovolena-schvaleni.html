<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ke schválení — Koupelny Syrový</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../shared/shared.css">
</head>
<body>
<div class="topbar">
    <img src="../logo.png" alt="Koupelny Syrový" class="topbar__logo">
    <span class="topbar__title">Ke schválení</span>
    <div class="topbar__user">
        <span class="topbar__user-name" id="userName">…</span>
        <button class="btn-logout" id="logoutBtn">Odhlásit</button>
    </div>
</div>

<div class="page-wrap page-wrap--narrow">
    <div class="section-header">
        <h1>Kolize čekající na tvoje rozhodnutí</h1>
    </div>
    <div id="list"><div class="loader"><div class="spinner"></div>Načítám…</div></div>
</div>

<script type="module">
import { requireAuth, signOutUser, formatDate, showToast } from '../shared/auth-common.js';
import { listAllVacations, resolveCollision, STATUS_LABELS } from './dovolena-common.js';

let session = null;
let usersData = {};

async function init() {
    session = await requireAuth('/login.html');
    if (!session) return;

    document.getElementById('userName').textContent = session.profile?.name ?? session.user.email;
    document.getElementById('logoutBtn').addEventListener('click', () => signOutUser('/login.html'));

    usersData = await loadUsers();
    await render();
}

async function loadUsers() {
    const { initFirebase, CDN } = await import('../shared/auth-common.js');
    const { db } = await initFirebase();
    const { collection, getDocs } = await import(`${CDN}/firebase-firestore.js`);
    const snap = await getDocs(collection(db, 'users'));
    return Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
}

function contactLine(u) {
    if (!u) return '';
    return [u.phone, u.email].filter(Boolean).join(' · ');
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function isMyDecision(v) {
    return v.status === 'pending_collision' &&
        (v.managerSlug === session.slug || session.slug === 'matous-syrovy');
}

async function render() {
    const all = await listAllVacations();
    const mine = all.filter(isMyDecision);

    const listEl = document.getElementById('list');
    if (mine.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Žádné kolize ke schválení.</div>';
        return;
    }

    listEl.innerHTML = '';
    for (const v of mine) {
        const person = usersData[v.userId];
        const substitute = usersData[v.substituteUserId];

        // Kontext pro rozhodnutí: kdo jiný ze stejné manažerské skupiny má ve
        // stejném období dovolenou (aktivní, ne zrušenou/zamítnutou).
        const colliding = all.filter(o =>
            o.id !== v.id &&
            o.managerSlug === v.managerSlug &&
            o.status !== 'cancelled' && o.status !== 'rejected' &&
            o.startDate.toDate() <= v.endDate.toDate() &&
            o.endDate.toDate() >= v.startDate.toDate()
        );

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="section-header" style="padding:0 0 8px;">
                <h2 style="font-size:15px;">${escapeHtml(person?.name ?? v.userId)}</h2>
                <span class="badge badge--collision">${STATUS_LABELS[v.status]}</span>
            </div>
            <div class="text-dim">${formatDate(v.startDate)} – ${formatDate(v.endDate)}</div>
            <div class="mt-8"><strong>Zástup:</strong> ${escapeHtml(substitute?.name ?? '—')}
                ${contactLine(substitute) ? `<div class="text-dim">${escapeHtml(contactLine(substitute))}</div>` : ''}
            </div>
            ${v.note ? `<div class="text-dim mt-8">${escapeHtml(v.note)}</div>` : ''}
            ${colliding.length > 0 ? `
                <div class="divider"></div>
                <div class="text-dim" style="font-size:12px;">Koliduje s:</div>
                ${colliding.map(o => `<div class="mt-4">${escapeHtml(usersData[o.userId]?.name ?? o.userId)} — ${formatDate(o.startDate)} – ${formatDate(o.endDate)}</div>`).join('')}
            ` : ''}
        `;

        const actions = document.createElement('div');
        actions.className = 'day-actions';

        const approveBtn = document.createElement('button');
        approveBtn.className = 'btn btn--success btn--sm';
        approveBtn.textContent = 'Schválit';
        approveBtn.addEventListener('click', () => decide(v.id, 'confirmed', approveBtn, rejectBtn));

        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'btn btn--danger btn--sm';
        rejectBtn.textContent = 'Zamítnout';
        rejectBtn.addEventListener('click', () => decide(v.id, 'rejected', approveBtn, rejectBtn));

        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        card.appendChild(actions);

        listEl.appendChild(card);
    }
}

async function decide(vacationId, decision, approveBtn, rejectBtn) {
    approveBtn.disabled = true;
    rejectBtn.disabled = true;
    try {
        await resolveCollision(vacationId, decision, session.slug);
        showToast(decision === 'confirmed' ? 'Schváleno' : 'Zamítnuto', decision === 'confirmed' ? 'success' : '');
        await render();
    } catch (err) {
        console.error(err);
        showToast('Nepodařilo se uložit rozhodnutí, zkuste to znovu');
        approveBtn.disabled = false;
        rejectBtn.disabled = false;
    }
}

init();
</script>
</body>
</html>
