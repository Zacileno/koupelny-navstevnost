<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení — Koupelny Syrový</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="shared/shared.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <img src="logo.png" alt="Koupelny Syrový" class="login-card__logo">
        <h1 class="login-card__title" id="cardTitle">Přihlášení</h1>
        <p class="login-card__subtitle" id="cardSubtitle">Interní platforma</p>

        <div class="login-error" id="loginError"></div>
        <div class="login-info" id="loginInfo"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="vas@email.cz" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn--primary btn--login" id="loginBtn">
                Přihlásit se
            </button>
        </form>
        <div class="login-links">
            <button type="button" class="login-link" id="forgotLink">Zapomenuté heslo?</button>
        </div>

    </div>
</div>

<script type="module">
import { initFirebase, requireAuth, getUserSlug } from './shared/auth-common.js';

const CDN = 'https://www.gstatic.com/firebasejs/12.9.0';

const cardTitle    = document.getElementById('cardTitle');
const cardSubtitle = document.getElementById('cardSubtitle');
const errorEl = document.getElementById('loginError');
const infoEl  = document.getElementById('loginInfo');

const loginForm = document.getElementById('loginForm');
const loginBtn  = document.getElementById('loginBtn');
const forgotLink = document.getElementById('forgotLink');

const params = new URLSearchParams(window.location.search);
const explicitRedirect = params.get('redirect');

// Kam po přihlášení: pokud nikdo výslovně nežádal konkrétní stránku (?redirect=),
// pošli zaměstnance s aktivní adaptací rovnou na jeho plán, jinak na Dovolenou
// (dnešní univerzální výchozí bod).
async function resolveTarget(uid, slug) {
    if (explicitRedirect) return explicitRedirect;

    const { db } = await initFirebase();
    const { collection, query, where, getDocs } = await import(`${CDN}/firebase-firestore.js`);
    // employeeId je uid u starších Adaptace záznamů, slug u nových (admin konzole).
    const q = query(
        collection(db, 'adaptations'),
        where('employeeId', 'in', [uid, slug].filter(Boolean)),
        where('status', 'in', ['active', 'paused'])
    );
    const snap = await getDocs(q);
    return snap.empty ? '/dovolena/dovolena.html' : '/adaptace/muj-plan.html';
}

function showError(msg) {
    infoEl.classList.remove('visible');
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
}

function showInfo(msg) {
    errorEl.classList.remove('visible');
    infoEl.textContent = msg;
    infoEl.classList.add('visible');
}

function hideMessages() {
    errorEl.classList.remove('visible');
    infoEl.classList.remove('visible');
}

if (params.get('claimError') === '1') {
    showError('Účet ještě nemá dokončené nastavení přístupu. Zkuste se odhlásit a přihlásit znovu, případně kontaktujte administrátora.');
}

// Pokud je uživatel už přihlášený (a má platný slug claim), přesměruj rovnou.
//
// Past k opakování: requireAuth() při chybějícím slug claimu přesměruje na
// `${redirectPath}?redirect=...&claimError=1` — jenže tady na loginu je
// redirectPath vždy '/login.html', takže by se stránka přesměrovávala sama
// na sebe. `redirect` parametr pokaždé zabalí celou dosavadní (už zakódovanou)
// URL, takže by rostla exponenciálně, dokud by hosting neskončil chybou
// "URI Too Long" (přesně tohle potkalo Jana Vodičku 2026-09-01 se zastaralým
// tokenem bez claimu — viz CLAUDE.md). Proto se tenhle případ řeší přímo tady
// (odhlásit + ukázat chybu), ne přes requireAuth().
(async () => {
    const { auth } = await initFirebase();
    auth.onAuthStateChanged(async user => {
        if (!user) return;
        const slug = await getUserSlug();
        if (!slug) {
            await auth.signOut();
            showError('Účet ještě nemá dokončené nastavení přístupu. Zkuste se odhlásit a přihlásit znovu, případně kontaktujte administrátora.');
            return;
        }
        const session = await requireAuth('/login.html');
        if (session) window.location.href = await resolveTarget(session.user.uid, session.slug);
    });
})();

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Přihlašuji…';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const { auth } = await initFirebase();
        const { signInWithEmailAndPassword } = await import(`${CDN}/firebase-auth.js`);
        await signInWithEmailAndPassword(auth, email, password);

        // Stejná past jako u auto-přihlášení výše: requireAuth('/login.html')
        // by se odsud při chybějícím slug claimu přesměroval sám na sebe.
        const slug = await getUserSlug();
        if (!slug) {
            await auth.signOut();
            throw Object.assign(new Error('Účet nemá dokončené nastavení přístupu.'), { code: 'claim-missing' });
        }

        const session = await requireAuth('/login.html');
        if (session) window.location.href = await resolveTarget(session.user.uid, session.slug);
    } catch (err) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Přihlásit se';

        switch (err.code) {
            case 'auth/user-not-found':
            case 'auth/wrong-password':
            case 'auth/invalid-credential':
                showError('Nesprávný e-mail nebo heslo.');
                break;
            case 'auth/too-many-requests':
                showError('Příliš mnoho pokusů. Zkuste to za chvíli.');
                break;
            case 'auth/user-disabled':
                showError('Účet byl deaktivován. Kontaktujte administrátora.');
                break;
            case 'claim-missing':
                showError('Účet ještě nemá dokončené nastavení přístupu. Zkuste se odhlásit a přihlásit znovu, případně kontaktujte administrátora.');
                break;
            default:
                showError('Přihlášení se nezdařilo. Zkuste to znovu.');
                console.error(err);
        }
    }
});

// Obnova hesla e-mailem (sendPasswordResetEmail) nedochází — viz technický dluh
// v CLAUDE.md. Heslo místo toho resetuje HR/admin v admin konzoli (/admin/lide.html).
forgotLink.addEventListener('click', () => {
    showInfo('Ozvěte se svému manažerovi nebo administrátorovi. Heslo vám resetuje, dostanete dočasné heslo a po přihlášení si nastavíte nové.');
});
</script>
</body>
</html>
