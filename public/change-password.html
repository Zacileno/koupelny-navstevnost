<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Změna hesla — Koupelny Syrový</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="shared/shared.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <img src="logo.png" alt="Koupelny Syrový" class="login-card__logo">
        <h1 class="login-card__title">Nastavte si vlastní heslo</h1>
        <p class="login-card__subtitle">Přihlásili jste se dočasným sdíleným heslem — než budete moct pokračovat, nastavte si svoje vlastní.</p>

        <div class="login-error" id="errorEl"></div>

        <form id="changeForm">
            <div class="form-group">
                <label for="newPassword">Nové heslo</label>
                <input type="password" id="newPassword" placeholder="alespoň 8 znaků" autocomplete="new-password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Nové heslo znovu</label>
                <input type="password" id="confirmPassword" placeholder="alespoň 8 znaků" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="btn btn--primary btn--login" id="submitBtn">
                Uložit a pokračovat
            </button>
        </form>
    </div>
</div>

<script type="module">
import { initFirebase, getCurrentUser, getUserSlug, CDN } from './shared/auth-common.js';

const errorEl = document.getElementById('errorEl');
const form = document.getElementById('changeForm');
const submitBtn = document.getElementById('submitBtn');

function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
}

const params = new URLSearchParams(window.location.search);
const redirectTo = params.get('redirect') || '/dovolena/dovolena.html';

let user, slug;

(async () => {
    user = await getCurrentUser();
    if (!user) {
        window.location.href = `/login.html?redirect=${encodeURIComponent('/change-password.html' + window.location.search)}`;
        return;
    }
    slug = await getUserSlug();
})();

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('visible');

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
        showError('Hesla se neshodují.');
        return;
    }
    if (newPassword === 'ZmenSiHeslo') {
        showError('Tohle je to dočasné heslo — zvolte prosím jiné.');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Ukládám…';

    try {
        const { db } = await initFirebase();
        const { updatePassword } = await import(`${CDN}/firebase-auth.js`);
        const { doc, updateDoc } = await import(`${CDN}/firebase-firestore.js`);

        await updatePassword(user, newPassword);
        await updateDoc(doc(db, 'users', slug), { mustChangePassword: false });

        window.location.href = redirectTo;
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Uložit a pokračovat';

        if (err.code === 'auth/requires-recent-login') {
            showError('Z bezpečnostních důvodů se prosím odhlaste a přihlaste znovu dočasným heslem, pak to zkuste znovu.');
        } else if (err.code === 'auth/weak-password') {
            showError('Heslo je příliš slabé — zkuste delší nebo méně obvyklé.');
        } else {
            showError('Nepodařilo se uložit heslo, zkuste to znovu.');
            console.error(err);
        }
    }
});
</script>
</body>
</html>
