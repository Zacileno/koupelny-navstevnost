<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontrola realizace — Koupelny</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #179ED9;
      --gold: #C5A66B;
      --dark: #0d1117;
      --dark2: #161b22;
      --dark3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px 0;
    }

    header {
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    header .spacer { flex: 1; }

    header a.btn-dash {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--blue);
      text-decoration: none;
      border: 1px solid var(--blue);
      padding: 6px 14px;
      border-radius: 6px;
      transition: background .2s;
    }
    header a.btn-dash:hover { background: rgba(23,158,217,.12); }

    header #userName {
      font-size: 11px;
      color: var(--text2);
      margin-right: 4px;
    }
    header #logoutBtn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      background: none;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    header #logoutBtn:hover { color: var(--text); border-color: var(--text2); }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 7px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s;
      appearance: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
    }

    /* Validation error states */
    .field-error input,
    .field-error select,
    .field-error textarea {
      border-color: var(--red) !important;
      background: rgba(248,81,73,.06);
    }
    .field-error .radio-group label {
      border-color: var(--red);
    }
    .field-error-label {
      font-size: 11px;
      color: var(--red);
      margin-top: 5px;
      font-weight: 600;
    }
    .field.field-error > label {
      color: var(--red);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* Radio pills */
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .radio-group input[type="radio"] { display: none; }

    .radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: none;
      color: var(--text2);
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all .18s;
      margin-bottom: 0;
    }

    .radio-group input[type="radio"]:checked + label {
      background: rgba(23,158,217,.15);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Result-specific colors */
    .result-group input[type="radio"]:checked + label[data-val="bez_vad"] { background: rgba(63,185,80,.15); border-color: var(--green); color: var(--green); }
    .result-group input[type="radio"]:checked + label[data-val="drobne_vady"] { background: rgba(210,153,34,.15); border-color: var(--orange); color: var(--orange); }
    .result-group input[type="radio"]:checked + label[data-val="vazne_vady"] { background: rgba(248,81,73,.15); border-color: var(--red); color: var(--red); }
    .result-group input[type="radio"]:checked + label[data-val="ceka"] { background: rgba(139,148,158,.15); border-color: var(--text2); color: var(--text2); }
    .result-group input[type="radio"]:checked + label[data-val="reklamace"] { background: rgba(248,81,73,.2); border-color: var(--red); color: var(--red); }

    /* Star rating */
    .stars {
      display: flex;
      gap: 6px;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }
    .stars input { display: none; }
    .stars label {
      font-size: 28px;
      color: var(--border);
      cursor: pointer;
      transition: color .15s;
      margin-bottom: 0;
      text-transform: none;
      letter-spacing: 0;
      padding: 0;
    }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label {
      color: var(--gold);
    }

    /* Quality pills */
    .quality-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .quality-group input { display: none; }
    .quality-group label {
      font-size: 12px; font-weight: 600;
      color: var(--text2);
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all .18s;
      margin-bottom: 0;
      text-transform: none;
      letter-spacing: .5px;
    }
    .quality-group input:checked + label {
      background: rgba(23,158,217,.15);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Photo upload */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .upload-area:hover { border-color: var(--blue); background: rgba(23,158,217,.04); }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .upload-area p { font-size: 13px; color: var(--text2); }
    .upload-area span { font-size: 11px; color: var(--text2); opacity: .6; }

    #photo-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    #photo-preview .thumb {
      width: 80px; height: 80px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    /* Upload progress */
    .upload-status {
      font-size: 12px;
      color: var(--text2);
      margin-top: 8px;
      min-height: 18px;
    }

    /* Submit */
    .btn-submit {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: 8px;
    }
    .btn-submit:hover { opacity: .88; }
    .btn-submit:active { transform: scale(.99); }
    .btn-submit:disabled { opacity: .4; cursor: not-allowed; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 10px;
      letter-spacing: .5px;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--red); }

    select option { background: var(--dark2); }

    /* Weather widget */
    .weather-widget {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .weather-widget.loading { opacity: .6; }
    .weather-icon { font-size: 28px; line-height: 1; }
    .weather-info { flex: 1; }
    .weather-desc { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
    .weather-auto { font-size: 10px; color: var(--blue); letter-spacing: .5px; }
    .weather-inputs { display: flex; gap: 10px; align-items: center; }
    .weather-inputs input[type="number"] {
      width: 80px;
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      padding: 6px 10px;
      outline: none;
      text-align: center;
    }
    .weather-inputs input[type="number"]:focus { border-color: var(--blue); }
    .weather-inputs span { font-size: 18px; font-weight: 700; color: var(--text2); }
    .weather-status { font-size: 11px; color: var(--text2); min-height: 16px; margin-top: 4px; }
    .btn-fetch-weather {
      background: rgba(23,158,217,.15);
      border: 1px solid var(--blue);
      color: var(--blue);
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }
    .btn-fetch-weather:hover { background: rgba(23,158,217,.25); }

    @media (max-width: 480px) {
      .row2 { grid-template-columns: 1fr; }
      .radio-group label { font-size: 11px; padding: 7px 11px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Koupelny</div>
  <h1>Zápis z kontroly realizace</h1>
  <div class="spacer"></div>
  <span id="userName"></span>
  <button type="button" id="logoutBtn">Odhlásit</button>
  <a href="realizace-dashboard.html" class="btn-dash">Dashboard →</a>
</header>

<div class="container">

  <!-- ZAKÁZKA -->
  <div class="card">
    <div class="section-title">Zakázka</div>

    <div class="row2">
      <div class="field">
        <label>Jméno klienta</label>
        <input type="text" id="klient" placeholder="Jan Novák" />
      </div>
      <div class="field">
        <label>Místo realizace</label>
        <input type="text" id="misto" placeholder="Praha 5, Nádražní 12" />
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Datum kontroly</label>
        <input type="date" id="datum" />
      </div>
      <div class="field">
        <label>Čas kontroly</label>
        <input type="time" id="cas" />
      </div>
    </div>

    <div class="field">
      <label>Co se realizuje</label>
      <select id="typ">
        <option value="">— vyberte —</option>
        <option value="koupelna">Koupelna</option>
        <option value="koupelna_wc">Koupelna a WC</option>
        <option value="koupelny_wc">Koupelny a WC</option>
        <option value="wc">Samostatné WC</option>
        <option value="obkladacske_kompletace">Obkladačské práce a kompletace</option>
        <option value="obkladacske">Obkladačské práce</option>
        <option value="zamereni">Zaměření / tech. obhlídka</option>
      </select>
    </div>
  </div>

  <!-- POČASÍ -->
  <div class="card">
    <div class="section-title">Počasí</div>
    <div class="weather-widget" id="weather-widget">
      <div class="weather-icon" id="weather-icon">🌤</div>
      <div class="weather-info">
        <div class="weather-desc" id="weather-desc">Zadejte místo a datum pro automatické načtení</div>
        <div class="weather-auto" id="weather-auto"></div>
      </div>
      <div>
        <div class="weather-inputs">
          <input type="number" id="pocasi-teplota" placeholder="—" min="-30" max="50" step="0.5" />
          <span>°C</span>
        </div>
        <div class="weather-status" id="weather-status"></div>
      </div>
    </div>
    <div class="field">
      <label>Stav počasí</label>
      <div class="radio-group">
        <input type="radio" name="pocasi_stav" id="pw1" value="slunecno" /><label for="pw1">☀️ Slunečno</label>
        <input type="radio" name="pocasi_stav" id="pw2" value="polojasno" /><label for="pw2">⛅ Polojasno</label>
        <input type="radio" name="pocasi_stav" id="pw3" value="zatazeno" /><label for="pw3">☁️ Zataženo</label>
        <input type="radio" name="pocasi_stav" id="pw4" value="dest" /><label for="pw4">🌧 Déšť</label>
        <input type="radio" name="pocasi_stav" id="pw5" value="sneh" /><label for="pw5">❄️ Sníh</label>
        <input type="radio" name="pocasi_stav" id="pw6" value="mraz" /><label for="pw6">🥶 Mráz</label>
      </div>
    </div>
    <button type="button" class="btn-fetch-weather" onclick="nacistPocasi()">↻ Načíst počasí znovu</button>
  </div>

  <!-- PARTA -->
  <div class="card">
    <div class="section-title">Realizační parta</div>
    <div class="field">
      <div class="radio-group" id="parta-group">
        <input type="radio" name="parta" id="p1" value="praha_1" /><label for="p1">Parta Praha 1</label>
        <input type="radio" name="parta" id="p2" value="praha_2" /><label for="p2">Parta Praha 2</label>
        <input type="radio" name="parta" id="p3" value="pardubice_1" /><label for="p3">Parta Pardubice 1</label>
        <input type="radio" name="parta" id="p4" value="pardubice_2" /><label for="p4">Parta Pardubice 2</label>
        <input type="radio" name="parta" id="p5" value="brno" /><label for="p5">Parta Brno</label>
      </div>
    </div>
  </div>

  <!-- FÁZE + VÝSLEDEK -->
  <div class="card">
    <div class="section-title">Průběh</div>

    <div class="field">
      <label>Fáze stavby</label>
      <select id="faze">
        <option value="">— vyberte fázi —</option>
        <option value="prevzeti">Převzetí stavby</option>
        <option value="priprava">Příprava / bourání</option>
        <option value="instalace">Instalace voda a elektro</option>
        <option value="hydroizolace">Hydroizolace</option>
        <option value="obklady">Obklady a dlažby</option>
        <option value="sanita">Montáž sanity</option>
        <option value="dokonceni">Dokončení</option>
        <option value="predani">Předání stavby</option>
      </select>
    </div>

    <div class="field">
      <label>Výsledek kontroly</label>
      <div class="radio-group result-group">
        <input type="radio" name="vysledek" id="v1" value="bez_vad" />
        <label for="v1" data-val="bez_vad">✓ Bez vad</label>

        <input type="radio" name="vysledek" id="v2" value="drobne_vady" />
        <label for="v2" data-val="drobne_vady">⚠ Drobné vady</label>

        <input type="radio" name="vysledek" id="v3" value="vazne_vady" />
        <label for="v3" data-val="vazne_vady">✕ Vážné vady</label>

        <input type="radio" name="vysledek" id="v4" value="ceka" />
        <label for="v4" data-val="ceka">⏳ Čeká na další práci</label>

        <input type="radio" name="vysledek" id="v5" value="reklamace" />
        <label for="v5" data-val="reklamace">🔴 Reklamace</label>
      </div>
    </div>

    <div class="field">
      <label>Přítomnost klienta</label>
      <div class="radio-group">
        <input type="radio" name="klient_pritomen" id="kp1" value="ano" />
        <label for="kp1">👤 Ano</label>
        <input type="radio" name="klient_pritomen" id="kp2" value="ne" />
        <label for="kp2">— Ne</label>
      </div>
    </div>

    <div class="field">
      <label>Počet řemeslníků na stavbě</label>
      <div class="radio-group">
        <input type="radio" name="remeslnici" id="rem1" value="1" /><label for="rem1">1</label>
        <input type="radio" name="remeslnici" id="rem2" value="2" /><label for="rem2">2</label>
        <input type="radio" name="remeslnici" id="rem3" value="3" /><label for="rem3">3</label>
        <input type="radio" name="remeslnici" id="rem4" value="4" /><label for="rem4">4</label>
        <input type="radio" name="remeslnici" id="rem5" value="5" /><label for="rem5">5+</label>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Chyba v projektu</label>
        <div class="radio-group">
          <input type="radio" name="chyba_projekt" id="cp1" value="ano" /><label for="cp1">⚠ Ano</label>
          <input type="radio" name="chyba_projekt" id="cp2" value="ne" /><label for="cp2">✓ Ne</label>
        </div>
      </div>
      <div class="field">
        <label>Chyba v objednávce</label>
        <div class="radio-group">
          <input type="radio" name="chyba_objednavka" id="co1" value="ano" /><label for="co1">⚠ Ano</label>
          <input type="radio" name="chyba_objednavka" id="co2" value="ne" /><label for="co2">✓ Ne</label>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Poznámka / zápis ze stavby</label>
      <textarea id="poznamka" placeholder="např. oprava spádu ve sprše, vše bylo jinak ok..."></textarea>
    </div>
  </div>

  <!-- KVALITA -->
  <div class="card">
    <div class="section-title">Měření kvality</div>

    <div class="field">
      <label>Spokojenost klienta</label>
      <div class="stars">
        <input type="radio" name="spokojenost" id="s5" value="5" /><label for="s5" title="5 — Velmi spokojený">★</label>
        <input type="radio" name="spokojenost" id="s4" value="4" /><label for="s4" title="4 — Spokojený">★</label>
        <input type="radio" name="spokojenost" id="s3" value="3" /><label for="s3" title="3 — Neutrální">★</label>
        <input type="radio" name="spokojenost" id="s2" value="2" /><label for="s2" title="2 — Nespokojený">★</label>
        <input type="radio" name="spokojenost" id="s1" value="1" /><label for="s1" title="1 — Velmi nespokojený">★</label>
      </div>
      <div id="star-label" style="font-size:12px;color:var(--text2);margin-top:6px;min-height:16px;"></div>
    </div>

    <div class="field">
      <label>Kvalita řemesla</label>
      <div class="quality-group">
        <input type="radio" name="kvalita" id="q1" value="vynikajici" /><label for="q1">🟢 Výborná</label>
        <input type="radio" name="kvalita" id="q2" value="dobra" /><label for="q2">🔵 Dobrá</label>
        <input type="radio" name="kvalita" id="q3" value="prumerna" /><label for="q3">🟡 Průměrná</label>
        <input type="radio" name="kvalita" id="q4" value="spatna" /><label for="q4">🟠 Špatná</label>
        <input type="radio" name="kvalita" id="q5" value="kriticka" /><label for="q5">🔴 Kritická</label>
      </div>
    </div>

    <div class="field">
      <label>Riziko zakázky</label>
      <div class="quality-group">
        <input type="radio" name="riziko" id="r1" value="bez_rizika" /><label for="r1">✅ Bez rizika</label>
        <input type="radio" name="riziko" id="r2" value="male_riziko" /><label for="r2">⚡ Malé riziko</label>
        <input type="radio" name="riziko" id="r3" value="problem_se_blizi" /><label for="r3">⚠️ Problém se blíží</label>
        <input type="radio" name="riziko" id="r4" value="problem" /><label for="r4">🔥 Problém</label>
        <input type="radio" name="riziko" id="r5" value="krizova" /><label for="r5">💀 Krizová zakázka</label>
      </div>
    </div>
  </div>

  <!-- FOTKY -->
  <div class="card">
    <div class="section-title">Fotodokumentace</div>
    <div class="upload-area" id="upload-area">
      <input type="file" id="foto-input" accept="image/*,.heic,.heif" multiple />
      <div class="upload-icon">📷</div>
      <p>Klepněte pro výběr nebo nafocení fotek</p>
      <span>JPG, PNG, HEIC — více fotek najednou</span>
    </div>
    <div id="photo-preview"></div>
    <div class="upload-status" id="upload-status"></div>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="ulozit()">Uložit zápis</button>
</div>

<div class="toast" id="toast"></div>

<!-- Přihlášení + Firebase -->
<script type="module">
  import { initFirebase, requireAuth, signOutUser } from '../shared/auth-common.js';

  const session = await requireAuth('/login.html');
  if (!session) throw new Error('not authenticated'); // requireAuth už přesměroval na login

  document.getElementById('userName').textContent = session.profile?.name ?? session.user.email;
  document.getElementById('logoutBtn').addEventListener('click', () => signOutUser('/login.html'));

  const { collection, addDoc, serverTimestamp } =
    await import('https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js');
  const { getStorage, ref, uploadBytes, getDownloadURL } =
    await import('https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js');

  const { app, db } = await initFirebase();
  const storage = getStorage(app);

  // Předvyplnit dnešní datum
  const dnes = new Date().toISOString().split('T')[0];
  document.getElementById('datum').value = dnes;

  // URL parametry
  const params = new URLSearchParams(window.location.search);
  const urlParta = params.get('parta');
  if (urlParta) {
    const el = document.querySelector(`input[name="parta"][value="${urlParta}"]`);
    if (el) el.checked = true;
  }

  // Auto-clear field errors on change
  document.querySelectorAll('input, select, textarea').forEach(el => {
    el.addEventListener('change', () => {
      const field = el.closest('.field');
      if (field) {
        field.classList.remove('field-error');
        field.querySelectorAll('.field-error-label').forEach(e => e.remove());
      }
    });
    el.addEventListener('input', () => {
      const field = el.closest('.field');
      if (field) {
        field.classList.remove('field-error');
        field.querySelectorAll('.field-error-label').forEach(e => e.remove());
      }
    });
  });

  // Star labels
  const starLabels = { 5: '5 ★ Velmi spokojený', 4: '4 ★ Spokojený', 3: '3 ★ Neutrální', 2: '2 ★ Nespokojený', 1: '1 ★ Velmi nespokojený' };
  document.querySelectorAll('input[name="spokojenost"]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('star-label').textContent = starLabels[r.value] || '';
    });
  });

  // --- POČASÍ ---
  const POCASI_ICONS = { slunecno:'☀️', polojasno:'⛅', zatazeno:'☁️', dest:'🌧', sneh:'❄️', mraz:'🥶' };

  function wmoToStav(wmo, temp) {
    if (temp <= -2) return 'mraz';
    if (wmo === 0) return 'slunecno';
    if (wmo <= 2) return 'polojasno';
    if (wmo === 3) return 'zatazeno';
    if ((wmo >= 51 && wmo <= 67) || (wmo >= 80 && wmo <= 82)) return 'dest';
    if ((wmo >= 71 && wmo <= 77) || (wmo >= 85 && wmo <= 86)) return 'sneh';
    if (wmo >= 95) return 'dest';
    return 'polojasno';
  }

  const WMO_DESC = {
    0:'Jasno', 1:'Převážně jasno', 2:'Polojasno', 3:'Zataženo',
    45:'Mlha', 48:'Mlha s námrazou',
    51:'Slabé mrholení', 53:'Mrholení', 55:'Silné mrholení',
    61:'Slabý déšť', 63:'Déšť', 65:'Silný déšť',
    71:'Slabé sněžení', 73:'Sněžení', 75:'Silné sněžení',
    80:'Přeháňky', 81:'Přeháňky', 82:'Silné přeháňky',
    85:'Sněhové přeháňky', 86:'Silné sněhové přeháňky',
    95:'Bouřka', 96:'Bouřka s krupobitím', 99:'Silná bouřka'
  };

  let weatherFetched = false;

  async function geocode(misto) {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(misto + ', Česká republika')}&format=json&limit=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'cs' } });
    const data = await res.json();
    if (!data.length) throw new Error('Místo nenalezeno');
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name.split(',')[0] };
  }

  async function fetchWeather(lat, lon, datum) {
    const isToday = datum === new Date().toISOString().split('T')[0];
    const isPast = datum < new Date().toISOString().split('T')[0];
    let url;
    if (isPast || isToday) {
      url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${datum}&end_date=${datum}&daily=temperature_2m_mean,weathercode&timezone=Europe%2FPrague`;
    } else {
      url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_mean,weathercode&start_date=${datum}&end_date=${datum}&timezone=Europe%2FPrague`;
    }
    const res = await fetch(url);
    const data = await res.json();
    if (!data.daily) throw new Error('Data nedostupná');
    return {
      teplota: Math.round(data.daily.temperature_2m_mean[0] * 10) / 10,
      wmo: data.daily.weathercode[0]
    };
  }

  window.nacistPocasi = async function() {
    const misto = document.getElementById('misto').value.trim();
    const datum = document.getElementById('datum').value;
    if (!misto || !datum) {
      document.getElementById('weather-status').textContent = 'Nejprve vyplňte místo a datum';
      return;
    }
    document.getElementById('weather-status').textContent = '⏳ Načítám…';
    document.getElementById('weather-widget').classList.add('loading');
    try {
      const geo = await geocode(misto);
      const w = await fetchWeather(geo.lat, geo.lon, datum);
      const stav = wmoToStav(w.wmo, w.teplota);
      const desc = WMO_DESC[w.wmo] || 'Neznámý stav';

      document.getElementById('pocasi-teplota').value = w.teplota;
      document.getElementById('weather-icon').textContent = POCASI_ICONS[stav];
      document.getElementById('weather-desc').textContent = desc;
      document.getElementById('weather-auto').textContent = `📍 ${geo.name} · automaticky načteno`;
      document.getElementById('weather-status').textContent = '';

      const radio = document.querySelector(`input[name="pocasi_stav"][value="${stav}"]`);
      if (radio) radio.checked = true;

      weatherFetched = true;
    } catch(e) {
      document.getElementById('weather-status').textContent = '⚠ Nepodařilo se načíst — vyplňte ručně';
      document.getElementById('weather-auto').textContent = '';
      console.error(e);
    }
    document.getElementById('weather-widget').classList.remove('loading');
  };

  // Auto-trigger when both misto and datum are filled
  let weatherTimer = null;
  function triggerWeatherIfReady() {
    const misto = document.getElementById('misto').value.trim();
    const datum = document.getElementById('datum').value;
    if (misto.length >= 4 && datum && !weatherFetched) {
      clearTimeout(weatherTimer);
      weatherTimer = setTimeout(() => nacistPocasi(), 1200);
    }
  }
  document.getElementById('misto').addEventListener('input', () => { weatherFetched = false; triggerWeatherIfReady(); });
  document.getElementById('datum').addEventListener('change', () => { weatherFetched = false; triggerWeatherIfReady(); });

  // Photo preview — accumulates files, each removable
  let selectedFiles = []; // array of { file, previewUrl }

  function renderPhotoPreview() {
    const preview = document.getElementById('photo-preview');
    preview.innerHTML = '';
    selectedFiles.forEach((entry, idx) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;display:inline-block';
      if (entry.previewUrl) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = entry.previewUrl;
        wrap.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'thumb';
        ph.style.cssText = 'display:flex;align-items:center;justify-content:center;background:var(--dark3);border:1px solid var(--border);border-radius:8px;font-size:22px;width:80px;height:80px;';
        ph.textContent = '📷';
        wrap.appendChild(ph);
      }
      const btn = document.createElement('button');
      btn.textContent = '×';
      btn.style.cssText = 'position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#f85149;border:none;color:#fff;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:Montserrat';
      btn.onclick = () => { selectedFiles.splice(idx, 1); renderPhotoPreview(); updatePhotoStatus(); };
      wrap.appendChild(btn);
      preview.appendChild(wrap);
    });
  }

  function updatePhotoStatus() {
    document.getElementById('upload-status').textContent =
      selectedFiles.length > 0 ? `${selectedFiles.length} foto(k) připraveno k nahrání` : '';
  }

  async function convertIfHeic(file) {
    const name = file.name.toLowerCase();
    const isHeic = name.endsWith('.heic') || name.endsWith('.heif')
      || file.type === 'image/heic' || file.type === 'image/heif' || file.type === '';

    if (!isHeic) return { file, previewUrl: URL.createObjectURL(file) };

    // Try native createImageBitmap (works in Safari 17+ and Chrome)
    try {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      canvas.getContext('2d').drawImage(bitmap, 0, 0);
      bitmap.close();
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.88));
      const converted = new File([blob], name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
      return { file: converted, previewUrl: URL.createObjectURL(converted) };
    } catch(e) {
      // Fallback: upload original, show placeholder preview
      console.warn('HEIC nativní konverze nepodporována, nahrávám originál');
      return { file, previewUrl: null };
    }
  }

  document.getElementById('foto-input').addEventListener('change', async function() {
    const rawFiles = Array.from(this.files);
    this.value = '';
    document.getElementById('upload-status').textContent = '⏳ Zpracovávám fotky…';

    for (const raw of rawFiles) {
      const result = await convertIfHeic(raw);
      const exists = selectedFiles.some(s => s.file.name === result.file.name && s.file.size === result.file.size);
      if (!exists) selectedFiles.push(result);
    }

    renderPhotoPreview();
    updatePhotoStatus();
  });

  // Toast helper
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // GET radio value
  function getRadio(name) {
    const el = document.querySelector(`input[name="${name}"]:checked`);
    return el ? el.value : null;
  }

  // ULOŽENÍ
  window.ulozit = async function() {
    const klient = document.getElementById('klient').value.trim();
    const misto = document.getElementById('misto').value.trim();
    const datum = document.getElementById('datum').value;
    const cas = document.getElementById('cas').value;
    const typ = document.getElementById('typ').value;
    const parta = getRadio('parta');
    const faze = document.getElementById('faze').value;
    const vysledek = getRadio('vysledek');
    const klientPritomen = getRadio('klient_pritomen');
    const poznamka = document.getElementById('poznamka').value.trim();
    const spokojenost = getRadio('spokojenost');
    const kvalita = getRadio('kvalita');
    const riziko = getRadio('riziko');
    const remeslnici = getRadio('remeslnici');
    const chybaProjekt = getRadio('chyba_projekt');
    const chybaObjednavka = getRadio('chyba_objednavka');
    const pocasiTeplota = document.getElementById('pocasi-teplota').value;
    const pocasiStav = getRadio('pocasi_stav');

    if (!klient || !datum || !parta || !faze || !vysledek) {
      // Clear previous errors
      document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
      document.querySelectorAll('.field-error-label').forEach(el => el.remove());

      const errors = [];

      function markError(el, msg) {
        const field = el.closest('.field') || el.closest('.card');
        if (field) {
          field.classList.add('field-error');
          const errEl = document.createElement('div');
          errEl.className = 'field-error-label';
          errEl.textContent = msg;
          field.appendChild(errEl);
          errors.push(field);
        }
      }

      if (!klient) markError(document.getElementById('klient'), '⚠ Vyplňte jméno klienta');
      if (!datum) markError(document.getElementById('datum'), '⚠ Vyplňte datum');
      if (!parta) markError(document.getElementById('parta-group'), '⚠ Vyberte partu');
      if (!faze) markError(document.getElementById('faze'), '⚠ Vyberte fázi stavby');
      if (!vysledek) markError(document.querySelector('[name="vysledek"]'), '⚠ Vyberte výsledek kontroly');

      if (errors.length > 0) {
        errors[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }

    // Clear any previous errors on successful validation
    document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
    document.querySelectorAll('.field-error-label').forEach(el => el.remove());

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Ukládám...';

    // Upload fotek
    let fotoUrls = [];
    if (selectedFiles.length > 0) {
      document.getElementById('upload-status').textContent = 'Nahrávám fotky...';
      try {
        for (let i = 0; i < selectedFiles.length; i++) {
          const f = selectedFiles[i].file;
          const ts = Date.now();
          const storageRef = ref(storage, `realizace-foto/${datum}-${klient.replace(/\s/g,'_')}-${ts}-${i}`);
          await uploadBytes(storageRef, f);
          const url = await getDownloadURL(storageRef);
          fotoUrls.push(url);
          document.getElementById('upload-status').textContent = `Nahrávám ${i+1}/${selectedFiles.length}...`;
        }
      } catch(e) {
        console.error(e);
        showToast('Chyba při nahrávání fotek', true);
        btn.disabled = false;
        btn.textContent = 'Uložit zápis';
        return;
      }
    }

    const zaznam = {
      klient, misto, datum, cas, typ,
      parta, faze, vysledek,
      klientPritomen: klientPritomen || 'ne',
      remeslnici: remeslnici || null,
      chybaProjekt: chybaProjekt || 'ne',
      chybaObjednavka: chybaObjednavka || 'ne',
      pocasi: {
        teplota: pocasiTeplota ? parseFloat(pocasiTeplota) : null,
        stav: pocasiStav || null,
        zdroj: weatherFetched ? 'auto' : 'manual'
      },
      poznamka,
      spokojenost: spokojenost ? parseInt(spokojenost) : null,
      kvalita: kvalita || null,
      riziko: riziko || null,
      foto: fotoUrls,
      createdAt: serverTimestamp()
    };

    try {
      await addDoc(collection(db, 'realizace'), zaznam);
      showToast('✓ Zápis uložen!');
      // Reset formuláře, zachovat partu
      const savedParta = parta;
      document.querySelectorAll('input[type="text"], input[type="date"], input[type="time"], textarea, select').forEach(el => {
        if (el.type === 'date') el.value = dnes;
        else el.value = '';
      });
      document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(el => el.checked = false);
      if (savedParta) {
        const el = document.querySelector(`input[name="parta"][value="${savedParta}"]`);
        if (el) el.checked = true;
      }
      document.getElementById('photo-preview').innerHTML = '';
      document.getElementById('upload-status').textContent = '';
      document.getElementById('star-label').textContent = '';
      document.getElementById('pocasi-teplota').value = '';
      document.getElementById('weather-desc').textContent = 'Zadejte místo a datum pro automatické načtení';
      document.getElementById('weather-auto').textContent = '';
      document.getElementById('weather-icon').textContent = '🌤';
      weatherFetched = false;
      selectedFiles = [];
      renderPhotoPreview();
    } catch(e) {
      console.error(e);
      showToast('Chyba při ukládání do Firestore', true);
    }

    btn.disabled = false;
    btn.textContent = 'Uložit zápis';
  };
</script>
</body>
</html>
