<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard realizací — Koupelny</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #179ED9;
      --gold: #C5A66B;
      --dark: #0d1117;
      --dark2: #161b22;
      --dark3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --purple: #a371f7;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 10px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); }
    header h1 { font-size: 14px; font-weight: 700; color: var(--text); }
    header .spacer { flex: 1; }

    .nav-month {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-month button {
      background: var(--dark3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    .nav-month button:hover { background: var(--border); }
    #month-label { font-size: 13px; font-weight: 700; min-width: 130px; text-align: center; }

    .header-filters {
      display: flex;
      gap: 10px;
    }
    .header-filters select {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      transition: border-color .15s;
    }
    .header-filters select:focus { border-color: var(--blue); }

    header a.btn-form {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 7px;
      transition: opacity .2s;
    }
    header a.btn-form:hover { opacity: .82; }

    header #userName {
      font-size: 11px;
      color: var(--text2);
      margin-right: 4px;
    }
    header #logoutBtn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text2);
      background: none;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    header #logoutBtn:hover { color: var(--text); border-color: var(--text2); }

    /* MAIN */
    main { padding: 28px; }

    /* KPI CARDS */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent, var(--blue));
    }

    .kpi-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }
    .kpi-val { font-size: 36px; font-weight: 800; color: var(--text); line-height: 1; }
    .kpi-sub { font-size: 11px; color: var(--text2); margin-top: 6px; }
    .kpi-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 8px;
    }
    .kpi-badge.green { background: rgba(63,185,80,.18); color: var(--green); }
    .kpi-badge.red { background: rgba(248,81,73,.18); color: var(--red); }
    .kpi-badge.orange { background: rgba(210,153,34,.18); color: var(--orange); }

    /* CHARTS ROW */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .charts-row-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .chart-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .chart-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .chart-wrap { position: relative; height: 200px; }
    .chart-wrap.tall { height: 260px; }

    /* QUALITY SECTION */
    .quality-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .qual-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .qual-title { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }

    .stars-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .stars-display .big { font-size: 42px; font-weight: 800; color: var(--gold); }
    .stars-display .sub { font-size: 12px; color: var(--text2); }

    .bar-mini { margin-bottom: 8px; }
    .bar-mini-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 3px; }
    .bar-mini-track { background: var(--dark3); border-radius: 3px; height: 6px; }
    .bar-mini-fill { height: 6px; border-radius: 3px; transition: width .5s; }

    /* TABLE */
    .table-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .table-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .table-header .chart-title { margin-bottom: 0; }
    .table-header .spacer { flex: 1; }
    .table-header input[type="text"] {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      outline: none;
      width: 200px;
    }
    .table-header input:focus { border-color: var(--blue); }

    #table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; min-width: 700px; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--dark3);
    }
    td {
      padding: 11px 16px;
      font-size: 12px;
      border-bottom: 1px solid rgba(48,54,61,.5);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .badge-vysledek-bez_vad { background: rgba(63,185,80,.18); color: var(--green); }
    .badge-vysledek-drobne_vady { background: rgba(210,153,34,.18); color: var(--orange); }
    .badge-vysledek-vazne_vady { background: rgba(248,81,73,.18); color: var(--red); }
    .badge-vysledek-ceka { background: rgba(139,148,158,.18); color: var(--text2); }
    .badge-vysledek-reklamace { background: rgba(248,81,73,.25); color: var(--red); }

    .badge-riziko-bez_rizika { background: rgba(63,185,80,.18); color: var(--green); }
    .badge-riziko-male_riziko { background: rgba(23,158,217,.18); color: var(--blue); }
    .badge-riziko-problem_se_blizi { background: rgba(210,153,34,.18); color: var(--orange); }
    .badge-riziko-problem { background: rgba(248,81,73,.18); color: var(--red); }
    .badge-riziko-krizova { background: rgba(248,81,73,.3); color: var(--red); }

    .foto-thumb { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; cursor: pointer; }
    .foto-count { font-size: 10px; color: var(--text2); }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 88vh; border-radius: 8px; }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 28px;
      font-size: 32px;
      color: #fff;
      cursor: pointer;
      line-height: 1;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      font-size: 40px;
      color: rgba(255,255,255,.7);
      cursor: pointer;
      user-select: none;
      padding: 20px;
    }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text2);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .empty { text-align: center; padding: 40px; color: var(--text2); font-size: 13px; }

    /* DETAIL MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 90%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 20px;
      font-size: 22px; cursor: pointer; color: var(--text2);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
    .modal-row { display: flex; gap: 8px; margin-bottom: 10px; font-size: 13px; }
    .modal-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); min-width: 110px; margin-top: 2px; }
    .modal-foto-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .modal-foto-grid img { width: 80px; height: 80px; border-radius: 6px; object-fit: cover; cursor: pointer; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn-edit { flex: 1; background: rgba(23,158,217,.15); border: 1px solid var(--blue); color: var(--blue); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; letter-spacing: .5px; transition: background .2s; }
    .btn-edit:hover { background: rgba(23,158,217,.25); }
    .btn-delete { flex: 1; background: rgba(248,81,73,.1); border: 1px solid var(--red); color: var(--red); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; letter-spacing: .5px; transition: background .2s; }
    .btn-delete:hover { background: rgba(248,81,73,.2); }

    /* Edit form modal */
    .edit-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 300; align-items: center; justify-content: center; }
    .edit-modal.open { display: flex; }
    .edit-modal-box { background: var(--dark2); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 90%; max-width: 600px; max-height: 88vh; overflow-y: auto; position: relative; }
    .edit-modal-box label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; margin-top: 14px; }
    .edit-modal-box input, .edit-modal-box select, .edit-modal-box textarea { width: 100%; background: var(--dark3); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: 'Montserrat', sans-serif; font-size: 13px; padding: 9px 12px; outline: none; }
    .edit-modal-box input:focus, .edit-modal-box select:focus, .edit-modal-box textarea:focus { border-color: var(--blue); }
    .edit-modal-box textarea { min-height: 70px; resize: vertical; }
    .edit-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .edit-save-btn { width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; padding: 13px; cursor: pointer; margin-top: 20px; letter-spacing: .5px; transition: opacity .2s; }
    .edit-save-btn:hover { opacity: .85; }

    .confirm-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 400; align-items: center; justify-content: center; }
    .confirm-modal.open { display: flex; }
    .confirm-box { background: var(--dark2); border: 1px solid var(--red); border-radius: 12px; padding: 28px; width: 90%; max-width: 380px; text-align: center; }
    .confirm-box h3 { font-size: 16px; margin-bottom: 10px; }
    .confirm-box p { font-size: 13px; color: var(--text2); margin-bottom: 22px; }
    .confirm-btns { display: flex; gap: 10px; }
    .confirm-btns button { flex: 1; padding: 11px; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
    .confirm-cancel { background: var(--dark3); color: var(--text2); }
    .confirm-ok { background: var(--red); color: #fff; }

    /* FILTER TOGGLE BUTTON */
    .btn-filtry {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text2);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: border-color .15s, color .15s;
    }
    .btn-filtry:hover { border-color: var(--blue); color: var(--blue); }
    .btn-filtry.active { border-color: var(--blue); color: var(--blue); background: rgba(23,158,217,.1); }
    .btn-filtry .f-count {
      background: var(--blue);
      color: #fff;
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
    }

    /* FILTER PANEL */
    .filter-panel {
      background: var(--dark3);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    .filter-panel.open { max-height: 220px; }
    .filter-panel-inner {
      padding: 14px 22px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .col-toggle-wrapper {
      width: 100%;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .col-toggle-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      white-space: nowrap;
    }
    .col-check {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .col-check input[type="checkbox"] {
      accent-color: var(--blue);
      cursor: pointer;
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-group label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
    }
    .filter-group input[type="text"],
    .filter-group select {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      min-width: 120px;
      transition: border-color .15s;
      cursor: pointer;
    }
    .filter-group input:focus,
    .filter-group select:focus { border-color: var(--blue); }
    .filter-group input.f-active,
    .filter-group select.f-active { border-color: var(--blue); color: var(--blue); }

    .btn-reset-filtry {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text2);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      align-self: flex-end;
    }
    .btn-reset-filtry:hover { border-color: var(--red); color: var(--red); }

    .btn-export {
      background-color: #179ED9;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-family: Montserrat, sans-serif;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-export:hover { background-color: #1387ba; }
    .btn-print { background-color: #444; }
    .btn-print:hover { background-color: #222; }

    @media (max-width: 900px) {
      .charts-row, .charts-row-3, .quality-grid { grid-template-columns: 1fr; }
      header { flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 10px; }
      main { padding: 16px; }
      .filter-panel.open { max-height: 300px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Koupelny</div>
  <h1>Dashboard realizací</h1>

  <div class="nav-month">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="month-label">—</span>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <div class="spacer"></div>
  <span id="userName"></span>
  <button type="button" id="logoutBtn">Odhlásit</button>
  <a href="realizace.html" class="btn-form">+ Nový zápis</a>
</header>

<main id="main-content">
  <div class="loading">Načítám data…</div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">×</span>
  <span class="lightbox-nav lightbox-prev" onclick="lbNav(-1);event.stopPropagation()">‹</span>
  <img id="lightbox-img" src="" />
  <span class="lightbox-nav lightbox-next" onclick="lbNav(1);event.stopPropagation()">›</span>
</div>

<!-- Detail modal -->
<div class="modal" id="detail-modal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div id="modal-content"></div>
    <div class="modal-actions">
      <button class="btn-edit" onclick="openEditFromDetail()">✏️ Upravit</button>
      <button class="btn-delete" onclick="openConfirmDelete()">🗑 Smazat</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="edit-modal" id="edit-modal">
  <div class="edit-modal-box">
    <span class="modal-close" onclick="closeEditModal()">×</span>
    <div class="modal-title">Upravit záznam</div>
    <div class="edit-row2">
      <div><label>Jméno klienta</label><input type="text" id="edit-klient" /></div>
      <div><label>Místo realizace</label><input type="text" id="edit-misto" /></div>
    </div>
    <div class="edit-row2">
      <div><label>Datum</label><input type="date" id="edit-datum" /></div>
      <div><label>Čas</label><input type="time" id="edit-cas" /></div>
    </div>
    <label>Co se realizuje</label>
    <select id="edit-typ">
      <option value="">— vyberte —</option>
      <option value="koupelna">Koupelna</option>
      <option value="koupelna_wc">Koupelna a WC</option>
      <option value="koupelny_wc">Koupelny a WC</option>
      <option value="wc">Samostatné WC</option>
      <option value="obkladacske_kompletace">Obkladačské práce a kompletace</option>
      <option value="obkladacske">Obkladačské práce</option>
      <option value="zamereni">Zaměření / tech. obhlídka</option>
    </select>
    <label>Realizační parta</label>
    <select id="edit-parta">
      <option value="">— vyberte —</option>
      <option value="praha_1">Parta Praha 1</option>
      <option value="praha_2">Parta Praha 2</option>
      <option value="pardubice_1">Parta Pardubice 1</option>
      <option value="pardubice_2">Parta Pardubice 2</option>

<script type="module">
  import { initFirebase, requireAuth, signOutUser } from '../shared/auth-common.js';

  const session = await requireAuth('/login.html');
  if (!session) throw new Error('not authenticated'); // requireAuth už přesměroval na login

  document.getElementById('userName').textContent = session.profile?.name ?? session.user.email;
  document.getElementById('logoutBtn').addEventListener('click', () => signOutUser('/login.html'));

  const { collection, query, where, getDocs, orderBy, doc, updateDoc, deleteDoc } =
    await import('https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js');

  const { db } = await initFirebase();

  // --- LABELS ---
  const PARTA_LABEL = { praha_1:'Praha 1', praha_2:'Praha 2', pardubice_1:'Pardubice 1', pardubice_2:'Pardubice 2', brno:'Brno' };
  const FAZE_LABEL = { prevzeti:'Převzetí stavby', priprava:'Příprava/bourání', instalace:'Instalace voda/elektro', hydroizolace:'Hydroizolace', obklady:'Obklady a dlažby', sanita:'Montáž sanity', dokonceni:'Dokončení', predani:'Předání stavby' };
  const VYSLEDEK_LABEL = { bez_vad:'Bez vad', drobne_vady:'Drobné vady', vazne_vady:'Vážné vady', ceka:'Čeká', reklamace:'Reklamace' };
  const KVALITA_LABEL = { vynikajici:'Výborná', dobra:'Dobrá', prumerna:'Průměrná', spatna:'Špatná', kriticka:'Kritická' };
  const RIZIKO_LABEL = { bez_rizika:'Bez rizika', male_riziko:'Malé riziko', problem_se_blizi:'Problém se blíží', problem:'Problém', krizova:'Krizová zakázka' };
  const TYP_LABEL = { koupelna:'Koupelna', koupelna_wc:'Koupelna + WC', koupelny_wc:'Koupelny + WC', wc:'WC', obkladacske_kompletace:'Obklad. + kompletace', obkladacske:'Obkladačské práce', zamereni:'Zaměření / tech. obhlídka' };
  const STAR_LABEL = { 5:'Velmi spokojený', 4:'Spokojený', 3:'Neutrální', 2:'Nespokojený', 1:'Velmi nespokojený' };

  // --- OPTIONAL TABLE COLUMNS ---
  const OPTIONAL_COLS = [
    { key: 'cas',             label: 'Čas',             render: r => r.cas || '—' },
    { key: 'typ',             label: 'Typ realizace',   render: r => TYP_LABEL[r.typ] || r.typ || '—' },
    { key: 'klientPritomen',  label: 'Klient přítomen', render: r => r.klientPritomen === 'ano' ? '✓ Ano' : '✗ Ne' },
    { key: 'remeslnici',      label: 'Řemeslníků',      render: r => r.remeslnici || '—' },
    { key: 'kvalita',         label: 'Kvalita',         render: r => KVALITA_LABEL[r.kvalita] || r.kvalita || '—' },
    { key: 'chybaProjekt',    label: 'Chyba projekt',   render: r => r.chybaProjekt === 'ano' ? '⚠ Ano' : '—' },
    { key: 'chybaObjednavka', label: 'Chyba obj.',      render: r => r.chybaObjednavka === 'ano' ? '⚠ Ano' : '—' },
    { key: 'pocasi',          label: 'Počasí',          render: r => !r.pocasi ? '—' : [r.pocasi.teplota != null ? r.pocasi.teplota+'°C' : '', r.pocasi.stav || ''].filter(Boolean).join(' ') || '—' },
    { key: 'poznamka',        label: 'Poznámka',        render: r => r.poznamka ? r.poznamka.substring(0, 45) + (r.poznamka.length > 45 ? '…' : '') : '—' },
  ];
  const LS_COL_KEY = 'realizace_visible_cols';
  function getVisibleCols() {
    try { return JSON.parse(localStorage.getItem(LS_COL_KEY)) || []; } catch { return []; }
  }

  // --- STATE ---
  let currentDate = new Date();
  let allData = [];
  let filteredData = [];
  let lbPhotos = []; let lbIdx = 0;
  let chartInstances = {};

  // --- MONTH NAV ---
  window.changeMonth = function(dir) {
    currentDate.setMonth(currentDate.getMonth() + dir);
    loadData();
  };

  function updateMonthLabel() {
    const opts = { month: 'long', year: 'numeric' };
    document.getElementById('month-label').textContent =
      currentDate.toLocaleDateString('cs-CZ', opts).replace(/^./, s => s.toUpperCase());
  }

  // --- LOAD ---
  async function loadData() {
    document.getElementById('main-content').innerHTML = '<div class="loading">Načítám data…</div>';
    updateMonthLabel();

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const from = `${year}-${String(month+1).padStart(2,'0')}-01`;
    const lastDay = new Date(year, month+1, 0).getDate();
    const to = `${year}-${String(month+1).padStart(2,'0')}-${lastDay}`;

    try {
      const q = query(
        collection(db, 'realizace'),
        where('datum', '>=', from),
        where('datum', '<=', to),
        orderBy('datum', 'desc')
      );
      const snap = await getDocs(q);
      allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      applyFilters();
    } catch(e) {
      console.error(e);
      document.getElementById('main-content').innerHTML = '<div class="loading">Chyba při načítání dat.</div>';
    }
  }

  window.toggleFiltry = function() {
    const panel = document.getElementById('filter-panel');
    const btn = document.getElementById('btn-filtry');
    panel.classList.toggle('open');
    btn.classList.toggle('active');
  };

  window.resetFiltry = function() {
    document.getElementById('filter-misto').value = '';
    document.getElementById('filter-parta').value = '';
    document.getElementById('filter-faze').value = '';
    document.getElementById('filter-vysledek').value = '';
    document.getElementById('filter-riziko').value = '';
    document.getElementById('filter-spokojenost').value = '';
    applyFilters();
  };

  function updateFilterBtn() {
    const ids = ['filter-misto','filter-parta','filter-faze','filter-vysledek','filter-riziko','filter-spokojenost'];
    const activeCount = ids.filter(id => document.getElementById(id)?.value).length;
    const btn = document.getElementById('btn-filtry');
    if (!btn) return; // tlačítko ještě není v DOM
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('f-active', !!el.value);
    });
    const existing = btn.querySelector('.f-count');
    if (existing) existing.remove();
    if (activeCount > 0) {
      const span = document.createElement('span');
      span.className = 'f-count';
      span.textContent = activeCount;
      btn.appendChild(span);
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  window.applyFilters = function() {
    const misto = document.getElementById('filter-misto')?.value.toLowerCase() || '';
    const parta = document.getElementById('filter-parta')?.value || '';
    const faze = document.getElementById('filter-faze')?.value || '';
    const vysledek = document.getElementById('filter-vysledek')?.value || '';
    const riziko = document.getElementById('filter-riziko')?.value || '';
    const spokojenost = parseInt(document.getElementById('filter-spokojenost')?.value) || 0;

    filteredData = allData.filter(r => {
      if (misto && !(r.misto||'').toLowerCase().includes(misto)) return false;
      if (parta && r.parta !== parta) return false;
      if (faze && r.faze !== faze) return false;
      if (vysledek && r.vysledek !== vysledek) return false;
      if (riziko && r.riziko !== riziko) return false;
      if (spokojenost && (r.spokojenost || 0) < spokojenost) return false;
      return true;
    });

    filteredData.sort((a, b) => {
      let valA, valB;
      if (sortKey === 'datum') {
        valA = (a.datum || '') + (a.createdAt?.seconds || 0).toString().padStart(12, '0');
        valB = (b.datum || '') + (b.createdAt?.seconds || 0).toString().padStart(12, '0');
      } else if (sortKey === 'klient') {
        valA = (a.klient || '').toLowerCase();
        valB = (b.klient || '').toLowerCase();
      }
      if (valA < valB) return sortDir === 'asc' ? -1 : 1;
      if (valA > valB) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    updateFilterBtn();
    renderDashboard();
  };

  // --- RENDER ---
  function renderDashboard() {
    const data = filteredData;

    // KPI
    const total = data.length;
    const bezVad = data.filter(r => r.vysledek === 'bez_vad').length;
    const reklamace = data.filter(r => r.vysledek === 'reklamace').length;
    const krizove = data.filter(r => r.riziko === 'krizova').length;
    const avgStar = data.filter(r => r.spokojenost).length
      ? (data.filter(r=>r.spokojenost).reduce((a,r)=>a+r.spokojenost,0) / data.filter(r=>r.spokojenost).length).toFixed(1)
      : '—';
    const okPct = total ? Math.round(bezVad/total*100) : 0;

    // Charts data
    const partaCounts = {};
    Object.keys(PARTA_LABEL).forEach(k => partaCounts[k] = 0);
    data.forEach(r => { if(r.parta) partaCounts[r.parta] = (partaCounts[r.parta]||0)+1; });

    const vysledekCounts = {};
    Object.keys(VYSLEDEK_LABEL).forEach(k => vysledekCounts[k] = 0);
    data.forEach(r => { if(r.vysledek) vysledekCounts[r.vysledek] = (vysledekCounts[r.vysledek]||0)+1; });

    const fazeCounts = {};
    Object.keys(FAZE_LABEL).forEach(k => fazeCounts[k] = 0);
    data.forEach(r => { if(r.faze) fazeCounts[r.faze] = (fazeCounts[r.faze]||0)+1; });

    const typCounts = {};
    data.forEach(r => { if(r.typ) typCounts[r.typ] = (typCounts[r.typ]||0)+1; });

    // Kvalita counts
    const kvalitaCounts = { vynikajici:0, dobra:0, prumerna:0, spatna:0, kriticka:0 };
    data.forEach(r => { if(r.kvalita) kvalitaCounts[r.kvalita]++; });

    const rizikoCounts = { bez_rizika:0, male_riziko:0, problem_se_blizi:0, problem:0, krizova:0 };
    data.forEach(r => { if(r.riziko) rizikoCounts[r.riziko]++; });

    // Daily counts
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const dailyCounts = Array(daysInMonth).fill(0);
    data.forEach(r => {
      if(r.datum) {
        const d = parseInt(r.datum.split('-')[2]);
        if(d >= 1 && d <= daysInMonth) dailyCounts[d-1]++;
      }
    });

    // Build HTML
    document.getElementById('main-content').innerHTML = `
      <!-- KPI -->
      <div class="kpi-grid">
        <div class="kpi-card" style="--accent:var(--blue)">
          <div class="kpi-label">Kontroly celkem</div>
          <div class="kpi-val">${total}</div>
          <div class="kpi-sub">v aktuálním měsíci</div>
        </div>
        <div class="kpi-card" style="--accent:var(--green)">
          <div class="kpi-label">Bez vad</div>
          <div class="kpi-val">${okPct}<span style="font-size:20px">%</span></div>
          <div class="kpi-badge ${okPct>=80?'green':okPct>=60?'orange':'red'}">${bezVad} / ${total} kontrol</div>
        </div>
        <div class="kpi-card" style="--accent:var(--gold)">
          <div class="kpi-label">Avg. spokojenost</div>
          <div class="kpi-val">${avgStar}<span style="font-size:20px;color:var(--gold)">★</span></div>
          <div class="kpi-sub">z 5 hvězdiček</div>
        </div>
        <div class="kpi-card" style="--accent:var(--red)">
          <div class="kpi-label">Reklamace / Krize</div>
          <div class="kpi-val">${reklamace}<span style="font-size:18px;color:var(--text2)"> / ${krizove}</span></div>
          <div class="kpi-sub">reklamace / krizové</div>
        </div>
      </div>

      <!-- Charts row 1 -->
      <div class="charts-row-3">
        <div class="chart-card">
          <div class="chart-title">Kontroly po dnech</div>
          <div class="chart-wrap tall"><canvas id="chart-daily"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Výsledky kontrol</div>
          <div class="chart-wrap tall"><canvas id="chart-vysledek"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Typy realizací</div>
          <div class="chart-wrap tall"><canvas id="chart-typ"></canvas></div>
        </div>
      </div>

      <!-- Charts row 2 -->
      <div class="charts-row">
        <div class="chart-card">
          <div class="chart-title">Party — počet kontrol</div>
          <div class="chart-wrap"><canvas id="chart-parta"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Fáze stavby</div>
          <div class="chart-wrap"><canvas id="chart-faze"></canvas></div>
        </div>
      </div>

      <!-- Quality -->
      <div class="quality-grid">
        ${renderStarCard(data)}
        ${renderMiniBarCard('Kvalita řemesla', kvalitaCounts, KVALITA_LABEL, ['#3fb950','#179ED9','#d29922','#f08a00','#f85149'])}
        ${renderMiniBarCard('Riziko zakázky', rizikoCounts, RIZIKO_LABEL, ['#3fb950','#179ED9','#d29922','#f85149','#c00'])}
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="table-header">
          <div class="chart-title">Záznamy</div>
          <button class="btn-filtry" id="btn-filtry" onclick="toggleFiltry()">⚙ Filtry</button>
          <button class="btn-export" onclick="exportToExcel()">⬇ Exportovat do Excelu</button>
          <button class="btn-export btn-print" onclick="printTable()">🖨 Tisk</button>
          <div class="spacer"></div>
          <input type="text" id="table-search" placeholder="Hledat klienta…" oninput="filterTable()" />
        </div>
        <div class="filter-panel" id="filter-panel">
          <div class="filter-panel-inner">
            <div class="filter-group">
              <label>Místo</label>
              <input type="text" id="filter-misto" placeholder="Hledat město…" oninput="applyFilters()" />
            </div>
            <div class="filter-group">
              <label>Parta</label>
              <select id="filter-parta" onchange="applyFilters()">
                <option value="">Všechny</option>
                <option value="praha_1">Praha 1</option>
                <option value="praha_2">Praha 2</option>
                <option value="pardubice_1">Pardubice 1</option>
                <option value="pardubice_2">Pardubice 2</option>
                <option value="brno">Brno</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Fáze stavby</label>
              <select id="filter-faze" onchange="applyFilters()">
                <option value="">Všechny</option>
                <option value="priprava">Příprava/bourání</option>
                <option value="hydroizolace">Hydroizolace</option>
                <option value="obklady">Obkladačské práce</option>
                <option value="instalace">Instalace voda/elektro</option>
                <option value="sanita">Montáž sanity</option>
                <option value="predani">Předání stavby</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Výsledek</label>
              <select id="filter-vysledek" onchange="applyFilters()">
                <option value="">Všechny</option>
                <option value="bez_vad">Bez vad</option>
                <option value="drobne_vady">Drobné vady</option>
                <option value="vazne_vady">Vážné vady</option>
                <option value="ceka">Čeká</option>
                <option value="reklamace">Reklamace</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Riziko</label>
              <select id="filter-riziko" onchange="applyFilters()">
                <option value="">Všechna</option>
                <option value="bez_rizika">Bez rizika</option>
                <option value="male_riziko">Malé riziko</option>
                <option value="problem_se_blizi">Problém se blíží</option>
                <option value="problem">Problém</option>
                <option value="krizova">Krizová zakázka</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Spokojenost</label>
              <select id="filter-spokojenost" onchange="applyFilters()">
                <option value="">Všechny</option>
                <option value="1">⭐ 1+</option>
                <option value="2">⭐⭐ 2+</option>
                <option value="3">⭐⭐⭐ 3+</option>
                <option value="4">⭐⭐⭐⭐ 4+</option>
                <option value="5">⭐⭐⭐⭐⭐ 5</option>
              </select>
            </div>
            <button class="btn-reset-filtry" onclick="resetFiltry()">✕ Reset</button>
            <div class="col-toggle-wrapper">
              <span class="col-toggle-label">Zobrazit sloupce</span>
              ${OPTIONAL_COLS.map(col => `<label class="col-check"><input type="checkbox" ${getVisibleCols().includes(col.key)?'checked':''} onchange="toggleCol('${col.key}')" />${col.label}</label>`).join('')}
            </div>
          </div>
        </div>
        <div id="table-wrap">
          ${renderTable(data)}
        </div>
      </div>
    `;

    // Render charts
    destroyCharts();

    const CHART_DEFAULTS = {
      color: '#8b949e',
      font: { family: 'Montserrat', size: 11 }
    };
    Chart.defaults.color = CHART_DEFAULTS.color;
    Chart.defaults.font = CHART_DEFAULTS.font;

    // Daily line
    chartInstances.daily = new Chart(document.getElementById('chart-daily'), {
      type: 'bar',
      data: {
        labels: Array.from({length: daysInMonth}, (_,i) => i+1),
        datasets: [{
          data: dailyCounts,
          backgroundColor: 'rgba(23,158,217,.6)',
          borderColor: '#179ED9',
          borderWidth: 1,
          borderRadius: 3
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,ticks:{stepSize:1}}, x:{grid:{display:false}} } }
    });

    // Výsledek doughnut
    const vysledekColors = { bez_vad:'#3fb950', drobne_vady:'#d29922', vazne_vady:'#f85149', ceka:'#8b949e', reklamace:'#c00' };
    chartInstances.vysledek = new Chart(document.getElementById('chart-vysledek'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(vysledekCounts).map(k=>VYSLEDEK_LABEL[k]),
        datasets: [{ data: Object.values(vysledekCounts), backgroundColor: Object.keys(vysledekCounts).map(k=>vysledekColors[k]), borderWidth:0 }]
      },
      options: { plugins:{ legend:{ position:'bottom', labels:{boxWidth:10,padding:10,font:{size:10}} } }, cutout:'65%' }
    });

    // Typ doughnut
    const typColors = ['#179ED9','#C5A66B','#3fb950','#a371f7','#d29922','#f85149'];
    chartInstances.typ = new Chart(document.getElementById('chart-typ'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(typCounts).map(k=>TYP_LABEL[k]||k),
        datasets: [{ data: Object.values(typCounts), backgroundColor: typColors, borderWidth:0 }]
      },
      options: { plugins:{ legend:{ position:'bottom', labels:{boxWidth:10,padding:8,font:{size:10}} } }, cutout:'60%' }
    });

    // Parta bar
    chartInstances.parta = new Chart(document.getElementById('chart-parta'), {
      type: 'bar',
      data: {
        labels: Object.keys(partaCounts).map(k=>PARTA_LABEL[k]),
        datasets: [{
          data: Object.values(partaCounts),
          backgroundColor: ['rgba(23,158,217,.7)','rgba(23,158,217,.5)','rgba(197,166,107,.7)','rgba(197,166,107,.5)','rgba(63,185,80,.6)'],
          borderRadius: 5, borderWidth: 0
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,ticks:{stepSize:1}}, x:{grid:{display:false}} }, indexAxis:'y' }
    });

    // Faze bar
    chartInstances.faze = new Chart(document.getElementById('chart-faze'), {
      type: 'bar',
      data: {
        labels: Object.keys(fazeCounts).map(k=>FAZE_LABEL[k]),
        datasets: [{
          data: Object.values(fazeCounts),
          backgroundColor: 'rgba(163,113,247,.6)',
          borderRadius: 4, borderWidth: 0
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,ticks:{stepSize:1}}, x:{grid:{display:false},ticks:{maxRotation:35,font:{size:10}}} } }
    });
  }

  function renderStarCard(data) {
    const rated = data.filter(r => r.spokojenost);
    const avg = rated.length ? (rated.reduce((a,r)=>a+r.spokojenost,0)/rated.length) : 0;
    const dist = [5,4,3,2,1].map(s => ({ s, count: rated.filter(r=>r.spokojenost===s).length }));
    return `
      <div class="qual-card">
        <div class="qual-title">Spokojenost klienta</div>
        <div class="stars-display">
          <div class="big">${avg ? avg.toFixed(1) : '—'}</div>
          <div class="sub">/ 5<br><span style="color:var(--gold)">★★★★★</span><br>${rated.length} hodnocení</div>
        </div>
        ${dist.map(({s, count}) => `
          <div class="bar-mini">
            <div class="bar-mini-top"><span>${s}★ ${STAR_LABEL[s]}</span><span>${count}</span></div>
            <div class="bar-mini-track"><div class="bar-mini-fill" style="width:${rated.length?Math.round(count/rated.length*100):0}%;background:var(--gold)"></div></div>
          </div>`).join('')}
      </div>`;
  }

  function renderMiniBarCard(title, counts, labels, colors) {
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    const entries = Object.entries(counts);
    return `
      <div class="qual-card">
        <div class="qual-title">${title}</div>
        ${entries.map(([k, v], i) => `
          <div class="bar-mini">
            <div class="bar-mini-top"><span>${labels[k]||k}</span><span>${v}</span></div>
            <div class="bar-mini-track"><div class="bar-mini-fill" style="width:${total?Math.round(v/total*100):0}%;background:${colors[i]||'#179ED9'}"></div></div>
          </div>`).join('')}
      </div>`;
  }

  // Stav řazení tabulky
  let sortKey = 'datum';
  let sortDir = 'desc'; // desc = nejnovější nahoře

  window.sortTable = function(key) {
    if (sortKey === key) {
      sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    } else {
      sortKey = key;
      sortDir = key === 'datum' ? 'desc' : 'asc';
    }
    applyFilters();
  };

  // Store data globally for index-based access
  window._tableData = [];

  function renderTable(data) {
    window._tableData = data;
    if (!data.length) return '<div class="empty">Žádné záznamy pro tento měsíc</div>';
    const activeCols = OPTIONAL_COLS.filter(c => getVisibleCols().includes(c.key));
    return `<table>
      <thead><tr>
        <th onclick="sortTable('datum')" style="cursor:pointer;user-select:none">Datum ${sortKey==='datum' ? (sortDir==='desc' ? '↓' : '↑') : '<span style="opacity:0.3">↕</span>'}</th>
        <th onclick="sortTable('klient')" style="cursor:pointer;user-select:none">Klient ${sortKey==='klient' ? (sortDir==='desc' ? '↓' : '↑') : '<span style="opacity:0.3">↕</span>'}</th>
        <th>Místo</th><th>Parta</th><th>Fáze</th><th>Výsledek</th><th>Riziko</th><th>★</th>
        ${activeCols.map(c => `<th>${c.label}</th>`).join('')}
        <th>Foto</th><th></th>
      </tr></thead>
      <tbody id="table-body">
        ${data.map((r, idx) => `
          <tr data-klient="${(r.klient||'').toLowerCase()}">
            <td style="white-space:nowrap">${r.datum||'—'}</td>
            <td><strong>${r.klient||'—'}</strong></td>
            <td style="font-size:11px;color:var(--text2)">${r.misto||'—'}</td>
            <td>${PARTA_LABEL[r.parta]||r.parta||'—'}</td>
            <td style="font-size:11px">${FAZE_LABEL[r.faze]||r.faze||'—'}</td>
            <td><span class="badge badge-vysledek-${r.vysledek}">${VYSLEDEK_LABEL[r.vysledek]||r.vysledek||'—'}</span></td>
            <td><span class="badge badge-riziko-${r.riziko}">${RIZIKO_LABEL[r.riziko]||r.riziko||'—'}</span></td>
            <td style="color:var(--gold)">${r.spokojenost ? r.spokojenost+'★' : '—'}</td>
            ${activeCols.map(c => `<td style="font-size:11px;color:var(--text2)">${c.render(r)}</td>`).join('')}
            <td>${r.foto && r.foto.length
              ? `<img class="foto-thumb" src="${r.foto[0]}" onclick="openLightboxByIdx(${idx},0)" />${r.foto.length>1?`<span class="foto-count">+${r.foto.length-1}</span>`:''}`
              : '<span class="foto-count">—</span>'}</td>
            <td><button onclick="openDetailByIdx(${idx})" style="background:none;border:1px solid var(--border);color:var(--text2);border-radius:5px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:Montserrat">Detail</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  }

  window.filterTable = function() {
    const q = document.getElementById('table-search').value.toLowerCase();
    document.querySelectorAll('#table-body tr').forEach(tr => {
      tr.style.display = tr.dataset.klient.includes(q) ? '' : 'none';
    });
  };

  window.toggleCol = function(key) {
    const cols = getVisibleCols();
    const i = cols.indexOf(key);
    if (i === -1) cols.push(key); else cols.splice(i, 1);
    localStorage.setItem(LS_COL_KEY, JSON.stringify(cols));
    document.getElementById('table-wrap').innerHTML = renderTable(filteredData);
    const searchEl = document.getElementById('table-search');
    if (searchEl && searchEl.value) filterTable();
  };

  // --- INDEX-BASED WRAPPERS ---
  window.openLightboxByIdx = function(rowIdx, photoIdx) {
    const r = window._tableData[rowIdx];
    if (r && r.foto) openLightbox(r.foto, photoIdx);
  };
  window.openDetailByIdx = function(rowIdx) {
    const r = window._tableData[rowIdx];
    if (r) openDetail(r);
  };

  // --- LIGHTBOX ---
  window.openLightbox = function(photos, idx) {
    lbPhotos = photos; lbIdx = idx;
    document.getElementById('lightbox-img').src = lbPhotos[lbIdx];
    document.getElementById('lightbox').classList.add('open');
  };
  window.closeLightbox = function() { document.getElementById('lightbox').classList.remove('open'); };
  window.lbNav = function(dir) {
    lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
    document.getElementById('lightbox-img').src = lbPhotos[lbIdx];
  };

  // --- DETAIL MODAL ---
  window.openDetail = function(r) {
    _currentRecord = r;
    window._modalFotos = r.foto || [];
    const mc = document.getElementById('modal-content');
    mc.innerHTML = `
      <div class="modal-title">${r.klient||'—'}</div>
      <div class="modal-row"><span class="modal-label">Datum</span><span>${r.datum||'—'} ${r.cas||''}</span></div>
      <div class="modal-row"><span class="modal-label">Místo</span><span>${r.misto||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Realizace</span><span>${TYP_LABEL[r.typ]||r.typ||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Parta</span><span>${PARTA_LABEL[r.parta]||r.parta||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Fáze stavby</span><span>${FAZE_LABEL[r.faze]||r.faze||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Výsledek</span><span class="badge badge-vysledek-${r.vysledek}">${VYSLEDEK_LABEL[r.vysledek]||r.vysledek||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Klient přítomen</span><span>${r.klientPritomen==='ano'?'✓ Ano':'— Ne'}</span></div>
      <div class="modal-row"><span class="modal-label">Počasí</span><span>${r.pocasi ? `${r.pocasi.teplota !== null ? r.pocasi.teplota+'°C' : '—'} · ${r.pocasi.stav||'—'}${r.pocasi.zdroj==='auto'?' · 🔄 auto':''}` : '—'}</span></div>
      <div class="modal-row"><span class="modal-label">Řemeslníků</span><span>${r.remeslnici||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Chyba v projektu</span><span style="color:${r.chybaProjekt==='ano'?'var(--red)':'var(--green)'}">${r.chybaProjekt==='ano'?'⚠ Ano':'✓ Ne'}</span></div>
      <div class="modal-row"><span class="modal-label">Chyba v obj.</span><span style="color:${r.chybaObjednavka==='ano'?'var(--red)':'var(--green)'}">${r.chybaObjednavka==='ano'?'⚠ Ano':'✓ Ne'}</span></div>
      <div class="modal-row"><span class="modal-label">Spokojenost</span><span style="color:var(--gold)">${r.spokojenost?r.spokojenost+'★ '+STAR_LABEL[r.spokojenost]:'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Kvalita řemesla</span><span>${KVALITA_LABEL[r.kvalita]||r.kvalita||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Riziko</span><span class="badge badge-riziko-${r.riziko}">${RIZIKO_LABEL[r.riziko]||r.riziko||'—'}</span></div>
      ${r.poznamka?`<div class="modal-row"><span class="modal-label">Poznámka</span><span style="font-size:12px;line-height:1.5">${r.poznamka}</span></div>`:''}
      ${r.foto&&r.foto.length?`<div class="modal-label" style="margin-bottom:8px">Fotodokumentace</div><div class="modal-foto-grid">${r.foto.map((u,i)=>`<img src="${u}" onclick="openLightbox(window._modalFotos,${i})" />`).join('')}</div>`:''}
    `;
    document.getElementById('detail-modal').classList.add('open');
  };
  window.closeModal = function() { document.getElementById('detail-modal').classList.remove('open'); };
  document.getElementById('detail-modal').addEventListener('click', function(e) {
    if(e.target===this) closeModal();
  });

  // --- EDIT & DELETE ---
  let _currentRecord = null;

  window.openEditFromDetail = function() {
    if (!_currentRecord) return;
    const r = _currentRecord;
    closeModal();
    document.getElementById('edit-klient').value = r.klient || '';
    document.getElementById('edit-misto').value = r.misto || '';
    document.getElementById('edit-datum').value = r.datum || '';
    document.getElementById('edit-cas').value = r.cas || '';
    document.getElementById('edit-typ').value = r.typ || '';
    document.getElementById('edit-parta').value = r.parta || '';
    document.getElementById('edit-faze').value = r.faze || '';
    document.getElementById('edit-vysledek').value = r.vysledek || '';
    document.getElementById('edit-spokojenost').value = r.spokojenost || '';
    document.getElementById('edit-remeslnici').value = r.remeslnici || '';
    document.getElementById('edit-kvalita').value = r.kvalita || '';
    document.getElementById('edit-riziko').value = r.riziko || '';
    document.getElementById('edit-chybaProjekt').value = r.chybaProjekt || 'ne';
    document.getElementById('edit-chybaObjednavka').value = r.chybaObjednavka || 'ne';
    document.getElementById('edit-poznamka').value = r.poznamka || '';
    document.getElementById('edit-modal').classList.add('open');
  };

  window.closeEditModal = function() { document.getElementById('edit-modal').classList.remove('open'); };

  window.saveEdit = async function() {
    if (!_currentRecord) return;
    const btn = document.querySelector('.edit-save-btn');
    btn.disabled = true; btn.textContent = 'Ukládám...';
    const spokojenostVal = document.getElementById('edit-spokojenost').value;
    const updates = {
      klient: document.getElementById('edit-klient').value.trim(),
      misto: document.getElementById('edit-misto').value.trim(),
      datum: document.getElementById('edit-datum').value,
      cas: document.getElementById('edit-cas').value,
      typ: document.getElementById('edit-typ').value,
      parta: document.getElementById('edit-parta').value,
      faze: document.getElementById('edit-faze').value,
      vysledek: document.getElementById('edit-vysledek').value,
      spokojenost: spokojenostVal ? parseInt(spokojenostVal) : null,
      remeslnici: document.getElementById('edit-remeslnici').value || null,
      kvalita: document.getElementById('edit-kvalita').value || null,
      riziko: document.getElementById('edit-riziko').value || null,
      chybaProjekt: document.getElementById('edit-chybaProjekt').value,
      chybaObjednavka: document.getElementById('edit-chybaObjednavka').value,
      poznamka: document.getElementById('edit-poznamka').value.trim(),
    };
    try {
      await updateDoc(doc(db, 'realizace', _currentRecord.id), updates);
      closeEditModal();
      loadData();
    } catch(e) {
      console.error(e);
      alert('Chyba při ukládání');
    }
    btn.disabled = false; btn.textContent = 'Uložit změny';
  };

  window.openConfirmDelete = function() {
    closeModal();
    document.getElementById('confirm-modal').classList.add('open');
  };
  window.closeConfirm = function() { document.getElementById('confirm-modal').classList.remove('open'); };
  window.confirmDelete = async function() {
    if (!_currentRecord) return;
    try {
      await deleteDoc(doc(db, 'realizace', _currentRecord.id));
      closeConfirm();
      loadData();
    } catch(e) {
      console.error(e);
      alert('Chyba při mazání');
    }
  };

  function destroyCharts() {
    Object.values(chartInstances).forEach(c => c.destroy());
    chartInstances = {};
  }

  function getActiveFiltersInfo() {
    const labels = [];
    const suffixParts = [];
    const misto = document.getElementById('filter-misto')?.value;
    if (misto) { labels.push('Místo: ' + misto); suffixParts.push(misto); }
    const parta = document.getElementById('filter-parta')?.value;
    if (parta) { labels.push('Parta: ' + (PARTA_LABEL[parta] || parta)); suffixParts.push(PARTA_LABEL[parta] || parta); }
    const faze = document.getElementById('filter-faze')?.value;
    if (faze) { labels.push('Fáze: ' + (FAZE_LABEL[faze] || faze)); suffixParts.push(FAZE_LABEL[faze] || faze); }
    const vysledek = document.getElementById('filter-vysledek')?.value;
    if (vysledek) { labels.push('Výsledek: ' + (VYSLEDEK_LABEL[vysledek] || vysledek)); suffixParts.push(VYSLEDEK_LABEL[vysledek] || vysledek); }
    const riziko = document.getElementById('filter-riziko')?.value;
    if (riziko) { labels.push('Riziko: ' + (RIZIKO_LABEL[riziko] || riziko)); suffixParts.push(RIZIKO_LABEL[riziko] || riziko); }
    const spokojenost = document.getElementById('filter-spokojenost')?.value;
    if (spokojenost) { labels.push('Spokojenost: ' + spokojenost + '+'); suffixParts.push('spokojenost_' + spokojenost); }
    return {
      label: labels.join(' · '),
      suffix: suffixParts.length ? '_' + suffixParts.join('_').replace(/[\s/\\:*?"<>|]+/g, '_') : '',
    };
  }

  // --- TISK ---
  window.printTable = function() {
    if (!filteredData || filteredData.length === 0) {
      alert('Žádné záznamy k tisku pro zvolený měsíc.');
      return;
    }

    const opts = { month: 'long', year: 'numeric' };
    const monthLabel = currentDate.toLocaleDateString('cs-CZ', opts).replace(/^./, s => s.toUpperCase());
    const { label: filterLabel } = getActiveFiltersInfo();
    const visCols = OPTIONAL_COLS.filter(c => getVisibleCols().includes(c.key));
    const theadRow = `<tr><th>Datum</th><th>Klient</th><th>Místo</th><th>Parta</th><th>Fáze stavby</th><th>Výsledek</th><th>Riziko</th><th>★</th>${visCols.map(c => `<th>${c.label}</th>`).join('')}</tr>`;

    const rows = filteredData.map(r => `
      <tr>
        <td>${r.datum ? new Date(r.datum).toLocaleDateString('cs-CZ') : '—'}</td>
        <td><strong>${r.klient || '—'}</strong></td>
        <td>${r.misto || '—'}</td>
        <td>${PARTA_LABEL[r.parta] || r.parta || '—'}</td>
        <td>${FAZE_LABEL[r.faze] || r.faze || '—'}</td>
        <td>${VYSLEDEK_LABEL[r.vysledek] || r.vysledek || '—'}</td>
        <td>${RIZIKO_LABEL[r.riziko] || r.riziko || '—'}</td>
        <td>${r.spokojenost ? r.spokojenost + ' ★' : '—'}</td>
        ${visCols.map(c => `<td>${c.render(r)}</td>`).join('')}
      </tr>`).join('');

    const html = `<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Realizace – ${monthLabel}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
    @page { size: A4 landscape; margin: 12mm 10mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Montserrat, Arial, sans-serif; font-size: 7.5px; color: #1a1a1a; background: #fff; }
    h1 { font-size: 13px; font-weight: 700; color: #179ED9; margin-bottom: 2px; }
    .meta { font-size: 7px; color: #888; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #179ED9; color: #fff; }
    thead th { padding: 4px 5px; text-align: left; font-size: 7px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #e2e6ea; }
    tbody tr:nth-child(even) { background: #f4f6f8; }
    td { padding: 3px 5px; vertical-align: top; line-height: 1.4; }
    td strong { font-weight: 600; }
    .col-poznamka { font-size: 7px; color: #555; max-width: 90px; }
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <h1>Realizace – ${monthLabel}</h1>
  <div class="meta">Vytištěno: ${new Date().toLocaleDateString('cs-CZ')} · Počet záznamů: ${filteredData.length}${filterLabel ? ' · Filtry: ' + filterLabel : ''}</div>
  <table>
    <thead>${theadRow}</thead>
    <tbody>${rows}</tbody>
  </table>
</body>
</html>`;

    const w = window.open('', '_blank', 'width=1100,height=750');
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 600);
  };

  // --- EXPORT ---
  window.exportToExcel = function() {
    if (!filteredData || filteredData.length === 0) {
      alert('Žádné záznamy k exportu pro zvolený měsíc.');
      return;
    }

    const opts = { month: 'long', year: 'numeric' };
    const monthLabel = currentDate.toLocaleDateString('cs-CZ', opts).replace(/^./, s => s.toUpperCase());
    const { suffix: filterSuffix } = getActiveFiltersInfo();

    const visCols = OPTIONAL_COLS.filter(c => getVisibleCols().includes(c.key));

    const headers = [
      'Datum', 'Klient', 'Místo', 'Parta', 'Fáze stavby', 'Výsledek kontroly', 'Riziko', 'Spokojenost',
      ...visCols.map(c => c.label),
      'Zhotovitel (podpis)', 'Odběratel (podpis)',
    ];

    const rows = filteredData.map(r => [
      r.datum ? new Date(r.datum).toLocaleDateString('cs-CZ') : '',
      r.klient || '',
      r.misto || '',
      PARTA_LABEL[r.parta] || r.parta || '',
      FAZE_LABEL[r.faze] || r.faze || '',
      VYSLEDEK_LABEL[r.vysledek] || r.vysledek || '',
      RIZIKO_LABEL[r.riziko] || r.riziko || '',
      r.spokojenost ?? '',
      ...visCols.map(c => { const v = c.render(r); return v === '—' ? '' : v; }),
      '',
      '',
    ]);

    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);

    ws['!cols'] = [
      { wch: 12 }, { wch: 22 }, { wch: 20 }, { wch: 16 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 12 },
      ...visCols.map(() => ({ wch: 16 })),
      { wch: 22 }, { wch: 22 },
    ];

    ws['!freeze'] = { xSplit: 0, ySplit: 1 };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Realizace');

    const fileName = `realizace_${monthLabel.replace(' ', '_').toLowerCase()}${filterSuffix}.xlsx`;
    XLSX.writeFile(wb, fileName);
  };

  // --- INIT ---
  loadData();
</script>
</body>
</html>
